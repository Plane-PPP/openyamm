id: rulesets.maw_mm8_smoke
title: "Ruleset - MAW in the MM8 world: outdoor and indoor combat, loot, potions and crafting, save and load"
world: mm8
mode: faithful
tags: [rulesets, maw, mm8]
steps:
  - new_game_flow:
      start_map: out01.odm
      # The map's first actors are townsfolk: MAW's friendly-fire preference lets the party hit them.
      ruleset: {id: maw, difficulty: maw, progression: free, friendly_fire: true}
  - combat_loot: {actor_index: 0}
  - combat_loot: {actor_index: 1}
  - combat_loot: {actor_index: 2}
  - combat_loot: {actor_index: 3}
  - combat_loot: {actor_index: 4}
  - combat_loot: {actor_index: 5}
  - combat_loot: {actor_index: 6}
  - combat_loot: {actor_index: 7}
  - combat_loot: {actor_index: 8}
  - combat_loot: {actor_index: 9}
  - combat_loot: {actor_index: 10}
  - combat_loot: {actor_index: 11}
  - grant_item: {item_id: 222, power: 40}
  - use_item: {item_id: 222}
  - grant_item: {item_id: 1, enchant: [2, 5], rarity: 2, drop_level: 1}
  - grant_item: {item_id: 1043, count: 2}
  - craft: {target_item_id: 1, material_item_id: 1043, all: true}
  - assert:
      inventory_any_member: [{item_id: 1043, count: 0}]
      ruleset: {id: maw, rolled_items_min: 1, crafted_items_min: 1}
  - save_game: maw_mm8_out
  - load_map:
      map: d31.blv
  - damage_actor: {actor_index: 0, amount: 10000000, skip_dead: true}
  - damage_actor: {actor_index: 1, amount: 10000000, skip_dead: true}
  - advance_runtime: {seconds: 2}
  - save_game: maw_mm8_in
  - load_game: maw_mm8_out
  - assert:
      map: out01.odm
      ruleset: {id: maw, rolled_items_min: 1, crafted_items_min: 1}
  - load_game: maw_mm8_in
  - assert:
      map: d31.blv
      ruleset: {id: maw, crafted_items_min: 1}
