id: rulesets.roguelike_run
title: Roguelike - four dungeons, a sealed exit, level-ups, cards and talents, guardians' rewards and a camp
world: mm6
mode: faithful
tags: [rulesets, roguelike]
steps:
  # Any game brings the runtime up (the Hive, a map no run visits). `run new` then starts the run through the code a
  # new game from party creation uses (GameApplication::startNewSessionFromCharacterCreation), with four heroes of
  # level 1 and seed 4, so the route is the same on every run. The route takes one dungeon per tier of run.yml's
  # `route` (1, 2, 3, 3): Goblinwatch is the one dungeon of tier 1.
  - new_game_flow: {start_map: hive.blv}
  - console: {line: "run new 4", expect_contains: "Run started in 6d01.blv, seed 4."}
  - assert:
      map: 6d01.blv
      ruleset: {id: roguelike}
  # A moment of play closes the map's first fill, as the first frame of a game does: monsters that come later (the
  # guardian) no longer join the roster the clearing counts.
  - advance_runtime: {seconds: 0.1}
  - console: {line: "run", expect_contains: "dungeon 1 of 4, map 6d01.blv (on course), seed 4, order: 6d01.blv"}
  - console: {line: "loc", expect_contains: "position=(601.000, 6871.000,"}
  - console: {line: "run", expect_contains: "level-ups 0 of 10, guardian not called"}
  - console: {line: "run", expect_contains: "Roderick L1 Knight cards owed 0 Alexis L1 Archer cards owed 0"}
  - console: {line: "run", expect_contains: "rewards 0, items owed 0; gold 500 food 2;"}
  # A level-up heals (v1): a hero who is out comes round and every living hero gets back a quarter of the maximum.
  - setup_shortcut: {kind: set_member_points, member_index: 0, health: 1}
  - setup_shortcut: {kind: set_condition, member_index: 1, condition: unconscious, health: -5}
  # The way out is sealed until the guardian is slain: `run leave` walks out as the exit door does.
  - console: {line: "run leave", expect_contains: "The way out is sealed."}
  - assert: {map: 6d01.blv}
  # Slaying the dungeon passes the share of hit points that calls the guardian and gives the stop's three level-ups:
  # every hero rises by 4 levels each time and is owed three cards. The guardian stands at the entrance, and the run
  # first offers the way there.
  - console: {line: "actor kill 100000", expect_contains: "Actors killed: "}
  - console: {line: "run", expect_contains: "level-ups 3 of 10, guardian alive"}
  # Roderick from 1 and Alexis from -5 (out) heal by a quarter of each new maximum: 1 + 17 + 22 + 27 and
  # 0 + 12 + 15 + 18.
  - console: {line: "run", expect_contains: "hit points Roderick 67 Alexis 45 Serena 58 Zoltan 48"}
  - console: {line: "run", expect_contains: "toward the guardian 100%"}
  - console: {line: "run", expect_contains: "Roderick L13 Knight cards owed 3 Alexis L13 Archer cards owed 3"}
  - console: {line: "run", expect_contains: "asks: [1] Go to the entrance [2] Stay here"}
  # The choice is the game's own dialog with a button per answer; a click on the second declines the way.
  - assert:
      dialog: {active: true, action_label_present: "Go to the entrance"}
  - select_topic: {kind: event_choice, source_id: 0, action_id: 1, selection_index: 1, label: "Stay here"}
  # The run takes the answer on its next frame; a scenario's console line stands for that frame.
  - console: {line: "run", expect_contains: "guardian alive"}
  # The cards, hero by hero: twelve choices of four cards each (run.yml levels.offers), shown on the card screen. A
  # card is a skill step (a school's with its books) or a talent's next rank; the same seed deals the same cards.
  - console:
      line: run
      expect_contains: "card screen; asks: [1] Leather Armor: Expert [2] Onslaught (1/3) [3] Resolve (1/3) [4] Learn"
  - assert:
      dialog: {active: true, text_contains: "Roderick, level 13 Knight: choose one."}
  - console: {line: "run pick 1", expect_contains: "Picked: Leather Armor: Expert"}
  - console: {line: "run pick 1", expect_contains: "Picked: Sword: Expert"}
  # Sword at Expert opens the melee talents.
  - console:
      line: run
      expect_contains: "asks: [1] Leather Armor: Master [2] Bloodthirst (1/3) [3] Sweeping Blows (1/3) [4] Learn Bow"
  - console: {line: "run pick 3", expect_contains: "Picked: Sweeping Blows (1/3)"}
  - console: {line: "run", expect_contains: "Roderick L13 Knight cards owed 0 Alexis L13 Archer cards owed 3"}
  - console: {line: "run pick 2", expect_contains: "Picked: Cheat Death"}
  - console: {line: "run pick 2", expect_contains: "Picked: Resolve (1/3)"}
  - console: {line: "run pick 3", expect_contains: "Picked: Learn Earth Magic (+3 spell books)"}
  - console: {line: "run pick 3", expect_contains: "Picked: Attunement (1/3)"}
  - console: {line: "run pick 3", expect_contains: "Picked: Cheat Death"}
  - console: {line: "run pick 3", expect_contains: "Picked: Attunement (2/3)"}
  - console: {line: "run pick 1", expect_contains: "Picked: Staff: Expert"}
  - console: {line: "run pick 2", expect_contains: "Picked: Attunement (1/3)"}
  - console: {line: "run pick 3", expect_contains: "Picked: Learn Dagger"}
  - console: {line: "run", expect_contains: "Serena L13 Cleric cards owed 0 Zoltan L13 Sorcerer cards owed 0"}
  # The talents are kept by their ids.
  - console: {line: "run", expect_contains: "Roderick talents: sweeping_blows=1; Alexis talents: cheat_death=1"}
  - console: {line: "run", expect_contains: "Serena talents: attunement=2 cheat_death=1; Zoltan talents: attunement=1"}
  # The archer's card taught Earth Magic and gave real books: Deadly Swarm (MM6's book 1945), the school's weakest
  # attack spell, is among them.
  - assert:
      inventory_any_member: [{item_id: 1945, count: 1}]
  - console: {line: "run leave", expect_contains: "The way out is sealed."}
  # The save keeps the run in the middle of a dungeon: the level-ups and the living guardian come back with it.
  - save_game: roguelike_guardian
  - new_game_flow: {start_map: hive.blv}
  - load_game: roguelike_guardian
  - assert:
      map: 6d01.blv
      ruleset: {id: roguelike}
  - console: {line: "run", expect_contains: "dungeon 1 of 4, map 6d01.blv (on course), seed 4"}
  - console: {line: "run", expect_contains: "level-ups 3 of 10, guardian alive"}
  - console: {line: "run", expect_contains: "Roderick L13 Knight cards owed 0"}
  # The guardian's death opens the way out. Between two dungeons stands the camp: its shops, then the way on.
  - console: {line: "actor kill 100000", expect_contains: "Actors killed: 1"}
  - console: {line: "run", expect_contains: "level-ups 3 of 10, guardian slain"}
  # Its hoard, once: 1500 gold and an artifact (run.yml rewards.guardians).
  - console: {line: "run", expect_contains: "rewards 1 (items 2029), items owed 0; gold 2000 food 2;"}
  - assert:
      inventory_any_member: [{item_id: 2029, count: 1}]
  # Once: a save and a load give nothing more.
  - save_game: roguelike_rewarded
  - new_game_flow: {start_map: hive.blv}
  - load_game: roguelike_rewarded
  - console: {line: "run", expect_contains: "rewards 1 (items 2029), items owed 0; gold 2000 food 2;"}
  - assert:
      inventory_any_member: [{item_id: 2029, count: 1}]
  # The real Goblinwatch door and its OK action, including the deferred departure-dialog close. A debug `run leave`
  # skips that dialog and missed the first Windows playtest's blocker.
  - execute_event: {id: 51}
  - select_topic: {kind: map_transition_cancel, action_id: 0, match_label: "Close"}
  - assert:
      map: 6d01.blv
      dialog: {active: false}
  - execute_event: {id: 51}
  - assert:
      dialog: {active: true, action_label_present: "OK"}
  - select_topic: {kind: map_transition_confirm, action_id: 0, match_label: "OK"}
  # The camp's own menu: three answers, so that the way on is never cut off below the answer panel (the 2.4
  # playtest saw five shops and no "Go on" line).
  - assert:
      map: 6d01.blv
      dialog: {active: true, action_label_present: "Next dungeon"}
  - console: {line: "run", expect_contains: "asks: [1] Camp [2] Rest [3] Next dungeon"}
  # Camp: the shops' list. A shop is a house of the game with its own trade; closing it returns to the list.
  - select_topic: {kind: event_choice, action_id: 0, match_label: "Camp"}
  - console: {line: "run", expect_contains: "asks: [1] Weapons [2] Armor [3] Potions and magic"}
  - select_topic: {kind: event_choice, action_id: 0, match_label: "Weapons"}
  - assert:
      dialog: {active: true, house_dialog: true, source_id: 22, action_label_present: "Buy Standard"}
  - press_action: {action: cancel_dialog}
  - console: {line: "run", expect_contains: "guardian slain"}
  - assert:
      dialog: {active: true, action_label_present: "Spell books: elements"}
  # A guild of the camp sells its books to the run's party without a membership bought in a town.
  - select_topic: {kind: event_choice, action_id: 3, match_label: "Spell books: elements"}
  - assert:
      dialog: {active: true, house_dialog: true, source_id: 1214, action_label_present: "Buy Fire Spells"}
  - press_action: {action: cancel_dialog}
  - console: {line: "run", expect_contains: "guardian slain"}
  - assert:
      dialog: {active: true, action_label_present: "Spell books: elements"}
  # Closing the shops' list returns to the camp's menu.
  - press_action: {action: cancel_dialog}
  - console: {line: "run", expect_contains: "guardian slain"}
  - assert:
      dialog: {active: true, action_label_present: "Rest"}
  # The camp's alchemy shop sells small stacks of herbs and bottles besides its own goods (run.yml shops[].stock).
  - select_topic: {kind: event_choice, action_id: 0, match_label: "Camp"}
  - select_topic: {kind: event_choice, action_id: 2, match_label: "Potions and magic"}
  - assert:
      dialog: {active: true, house_dialog: true, source_id: 97}
  - console: {line: "run buy 1764", expect_contains: "Bought 3 of item 1764 for "}
  - console: {line: "run buy 1765", expect_contains: "Bought 3 of item 1765 for "}
  - assert:
      inventory_any_member: [{item_id: 1764, min_count: 1}, {item_id: 1765, min_count: 1}]
  - press_action: {action: cancel_dialog}
  - console: {line: "run", expect_contains: "guardian slain"}
  - press_action: {action: cancel_dialog}
  - console: {line: "run", expect_contains: "guardian slain"}
  - assert:
      dialog: {active: true, action_label_present: "Rest"}
  # Rest: the game's own Rest and Heal for the camp's price, 2 food (the start's two pay for it). The first Windows
  # playtest of v1 saw the food go and nothing else: no rest screen, no heal, the unconscious left out.
  - setup_shortcut: {kind: set_member_points, member_index: 0, health: 1, spell_points: 0}
  - setup_shortcut: {kind: set_condition, member_index: 1, condition: unconscious, health: -5}
  - setup_shortcut: {kind: set_member_points, member_index: 3, health: 1, spell_points: 0}
  - assert:
      dialog: {active: true, text_contains: "for 2 food"}
      condition: {name: unconscious, present: true, member_index: 1}
  - select_topic: {kind: event_choice, action_id: 1, match_label: "Rest"}
  # The rest screen runs its hourglass, its food counter at the camp's price; the camp's menu waits for it.
  - console: {line: "run", expect_contains: "rest screen, food 2"}
  - assert:
      dialog: {active: false}
      food: 0
  - advance_runtime: {seconds: 3}
  # Every hero wakes healed to the maximum, the unconscious one too (Roderick 1, Alexis out at 0, Zoltan 1 before),
  # in the morning: the camp's shops are open again. The rest screen is gone; the camp's menu comes back on the run's
  # next frame (the console line's).
  - console: {line: "run", expect_contains: "hit points Roderick 105 Alexis 72 Serena 58 Zoltan 48"}
  - console: {line: "run", expect_contains: "asks: [1] Camp [2] Rest [3] Next dungeon"}
  - assert:
      dialog: {active: true, text_contains: "The party rested until the morning (2 food)."}
      food: 0
      game_hour: 9
      condition: {name: unconscious, present: false, member_index: 1}
      party_health: {full: true}
      member_points: {member_index: 3, spell_points_min: 57, spell_points_max: 57}
  # The way on: the second stop is a dungeon of tier 2, with the map's own guardian.
  - select_topic: {kind: event_choice, action_id: 2, match_label: "Next dungeon"}
  - assert: {map: 6t3.blv}
  - advance_runtime: {seconds: 0.1}
  - console: {line: "run", expect_contains: "dungeon 2 of 4, map 6t3.blv (on course)"}
  - console: {line: "run", expect_contains: "level-ups 3 of 10, guardian not called"}
  - console: {line: "run leave", expect_contains: "The way out is sealed."}
  - console: {line: "actor kill 100000", expect_contains: "Actors killed: "}
  - console: {line: "run", expect_contains: "level-ups 6 of 10, guardian alive"}
  # The way to the entrance, where the guardian stands.
  - console: {line: "run pick 1", expect_contains: "Picked: Go to the entrance; map 6t3.blv"}
  - console: {line: "loc", expect_contains: "position=(2817.000, -4748.000,"}
  - console: {line: "run pick 1", expect_contains: "Picked: "}
  - console: {line: "run pick 1", expect_contains: "Picked: "}
  - console: {line: "run pick 1", expect_contains: "Picked: "}
  - console: {line: "run pick 1", expect_contains: "Picked: "}
  - console: {line: "run pick 1", expect_contains: "Picked: "}
  - console: {line: "run pick 1", expect_contains: "Picked: "}
  - console: {line: "run pick 1", expect_contains: "Picked: "}
  - console: {line: "run pick 1", expect_contains: "Picked: "}
  - console: {line: "run pick 1", expect_contains: "Picked: "}
  - console: {line: "run pick 1", expect_contains: "Picked: "}
  - console: {line: "run pick 1", expect_contains: "Picked: "}
  - console: {line: "run pick 1", expect_contains: "Picked: "}
  - console: {line: "run", expect_contains: "Roderick L25 Knight cards owed 0"}
  # The second guardian's death promotes the party (promotionAfterStop: 2).
  - console: {line: "actor kill 100000", expect_contains: "Actors killed: 1"}
  - console: {line: "run", expect_contains: "guardian slain"}
  - console: {line: "run", expect_contains: "Roderick L25 Cavalier cards owed 0 Alexis L25 WarriorMage"}
  - console: {line: "run", expect_contains: "rewards 2 (items 2029 2026), items owed 0; gold 4987 food 0;"}
  - console: {line: "run leave", expect_contains: "The camp."}
  - console: {line: "run pick 3", expect_contains: "Picked: Next dungeon; map 6d12.blv"}
  - advance_runtime: {seconds: 0.1}
  - console: {line: "run", expect_contains: "dungeon 3 of 4, map 6d12.blv (on course)"}
  - console: {line: "actor kill 100000", expect_contains: "Actors killed: "}
  - console: {line: "run", expect_contains: "level-ups 8 of 10, guardian alive"}
  - console: {line: "run pick 2", expect_contains: "Picked: Stay here"}
  - console: {line: "run pick 1", expect_contains: "Picked: "}
  - console: {line: "run pick 1", expect_contains: "Picked: "}
  - console: {line: "run pick 1", expect_contains: "Picked: "}
  - console: {line: "run pick 1", expect_contains: "Picked: "}
  - console: {line: "run pick 1", expect_contains: "Picked: "}
  - console: {line: "run pick 1", expect_contains: "Picked: "}
  - console: {line: "run pick 1", expect_contains: "Picked: "}
  - console: {line: "run pick 1", expect_contains: "Picked: "}
  - console: {line: "actor kill 100000", expect_contains: "Actors killed: 1"}
  - console: {line: "run", expect_contains: "rewards 3 (items 2029 2026 2046), items owed 0; gold 9987 food 0;"}
  - console: {line: "run leave", expect_contains: "The camp."}
  - console: {line: "run pick 3", expect_contains: "Picked: Next dungeon; map 6d07.blv"}
  - advance_runtime: {seconds: 0.1}
  - console: {line: "run", expect_contains: "dungeon 4 of 4, map 6d07.blv (on course)"}
  # The last dungeon: the tenth level-up comes with its guardian, and no clearing gives an eleventh.
  - console: {line: "actor kill 100000", expect_contains: "Actors killed: "}
  - console: {line: "run", expect_contains: "level-ups 10 of 10, guardian alive"}
  - console: {line: "run", expect_contains: "Roderick L41 Cavalier cards owed 2"}
  - console: {line: "run pick 2", expect_contains: "Picked: Stay here"}
  - console: {line: "run pick 1", expect_contains: "Picked: "}
  - console: {line: "run pick 1", expect_contains: "Picked: "}
  - console: {line: "run pick 1", expect_contains: "Picked: "}
  - console: {line: "run pick 1", expect_contains: "Picked: "}
  - console: {line: "run pick 1", expect_contains: "Picked: "}
  - console: {line: "run pick 1", expect_contains: "Picked: "}
  - console: {line: "run pick 1", expect_contains: "Picked: "}
  - console: {line: "run pick 1", expect_contains: "Picked: "}
  - console: {line: "run leave", expect_contains: "The way out is sealed."}
  - console: {line: "actor kill 100000", expect_contains: "Actors killed: 1"}
  - console: {line: "run", expect_contains: "level-ups 10 of 10, guardian slain"}
  # The last guardian leaves a relic and no gold: no camp follows it.
  - console: {line: "run", expect_contains: "rewards 4 (items 2029 2026 2046 2037), items owed 0; gold 9987 food 0;"}
  # Two artifacts (Arthur, Galahad) and two relics (Hermes, Poseidon), each in a hero's pack once.
  - assert:
      inventory_any_member: [{item_id: 2029, count: 1}, {item_id: 2026, count: 1}, {item_id: 2046, count: 1},
        {item_id: 2037, count: 1}]
  # No camp follows the last dungeon: leaving it wins the run.
  - console: {line: "run leave", expect_contains: "Victory! Run complete! Dungeons cleared: 4. Level-ups: 10."}
