id: rulesets.maw_knight_charge
title: Ruleset - MAW's Knight Charge throws a lone Knight at a monster 500-3000 units away, then waits 25 seconds
world: mm6
mode: faithful
tags: [rulesets, maw]
steps:
  - new_game_flow:
      start_map: oute3.odm
      ruleset: {id: maw, difficulty: maw, progression: free}
      party:
        gold: 0
        food: 10
        members:
          - name: Blade
            class: Knight
            level: 30
            skills:
              - {name: Sword, level: 10, mastery: 2}
            equipment: {}
  # A Crystal Guardian 1200 units east of the party at (-9728, -11319).
  - spawn_actor: {monster_id: 150, x: -8528, y: -11319, z: 200}
  # GAPS.md L6.1: the party covers 20/22 of the way; 1.5 seconds later 24 of the 25 seconds of cooldown remain.
  - party_charge: {actor_index: last, status: "Blade casts Charge stunning the enemy", advance_seconds: 1.5,
      min_moved: 900}
  - party_charge: {actor_index: last, status: "Charge has 24 seconds of cooldown"}
  # Indoors, once the cooldown is over: a Crystal Guardian 1000 units south of 6d01's entrance at (672, 6912).
  - load_map: {map: 6d01.blv}
  - advance_game_time: {minutes: 15}
  - spawn_actor: {monster_id: 150, x: 672, y: 5912, z: 192}
  - party_charge: {actor_index: last, status: "Blade casts Charge stunning the enemy", advance_seconds: 1.5,
      min_moved: 700}
