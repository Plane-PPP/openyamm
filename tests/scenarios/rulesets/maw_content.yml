id: rulesets.maw_content
title: "Ruleset - MAW content: the towns' dimensional travel pedestals and the edited maps' monsters"
world: mm6
mode: faithful
tags: [rulesets, maw]
steps:
  - new_game_flow:
      start_map: oute3.odm
      ruleset: {id: maw, difficulty: maw, progression: free}
  # Each town's pedestal opens the dimensional travel destinations, before the Cross Continents quest (DEVIATIONS 49).
  - assert: {dimension_door: {pending: false}}
  - execute_event: {id: 1777}
  - assert: {dimension_door: {pending: true, without_quest: true}}
  - load_map: {map: out02.odm}
  - assert: {dimension_door: {pending: false}}
  - execute_event: {id: 1777}
  - assert: {dimension_door: {pending: true, without_quest: true}}
  - load_map: {map: 7out02.odm}
  - assert: {dimension_door: {pending: false}}
  - execute_event: {id: 1777}
  - assert: {dimension_door: {pending: true, without_quest: true}}
  - load_map: {map: d18.blv}
  - assert:
      actor_visible: {actor_index: 0, name: "Naga Empress"}
  - load_map: {map: d04.blv}
  - assert:
      actor_visible: {actor_index: 34, name: "High Cardinal"}
