id: rulesets.maw_combat_save_load
title: Ruleset - MAW sizes a map's monsters, a kill pays MAW experience, and the actors' ruleset facts survive save and load
world: mm6
mode: faithful
tags: [rulesets, maw]
steps:
  - new_game_flow:
      start_map: oute3.odm
      ruleset:
        id: maw
        difficulty: hell
        progression: horizontal
  # New Sorpigal's townsfolk: with the friendly-fire preference off (MAW's default) the party's hits do nothing.
  - damage_actor: {actor_index: 0, amount: 100000, expect: refused}
  - assert:
      actor_visible: {actor_index: 0, dead: false}
  - set_ruleset: {options: friendlyfire}
  - damage_actor: {actor_index: 0, amount: 100000}
  - assert:
      actor_visible: {actor_index: 0, current_hp: 0}
  - save_game: maw_combat
  - load_game: maw_combat
  - assert:
      map: oute3.odm
      actor_visible: {actor_index: 0, current_hp: 0}
      ruleset:
        id: maw
        difficulty: hell
        progression: horizontal
