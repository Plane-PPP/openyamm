id: rulesets.maw_combat_rules
title: Ruleset - MAW weapon blows in a map, through the real attack path - Weak halves them, a Swift sword strikes faster, Grandmaster spear blows stack
world: mm6
mode: faithful
tags: [rulesets, maw]
steps:
  - new_game_flow:
      start_map: oute3.odm
      ruleset: {id: maw, difficulty: maw, progression: free}
      party:
        gold: 0
        food: 10
        members:
          - name: Blade
            class: Knight
            level: 30
            skills:
              - {name: Sword, level: 10, mastery: 2}
            equipment: {}
          - name: Lancer
            class: Champion
            level: 30
            skills:
              - {name: Spear, level: 20, mastery: 4}
            equipment: {}
  - grant_item: {item_id: 1, equip: main_hand, rarity: 1, item_power: 20, drop_level: 20}
  # A Human Mercenary C beside the party, healed after every blow.
  - spawn_actor: {monster_id: 195, near_party: true}
  - party_attack: {actor_index: last, count: 300, record: plain, min_hit_rate: 0.2, report: true}
  # GAPS.md A1.4: Weak halves every weapon blow.
  - party_attack:
      actor_index: last
      count: 300
      conditions: [weak]
      ratio_to: plain
      damage_ratio: [0.42, 0.58]
      recovery_ratio: [0.99, 1.01]
      report: true
  # GAPS.md A1.3: a Swift (59) one-handed sword divides the delay by 1.15.
  - grant_item: {item_id: 1, equip: main_hand, rarity: 1, item_power: 20, drop_level: 20, special: 59}
  - party_attack:
      actor_index: last
      count: 50
      ratio_to: plain
      recovery_ratio: [0.84, 0.90]
      report: true
  # GAPS.md A1.8: a Grandmaster spear's blows make a fresh target take more and more physical damage (a Crystal
  # Guardian, tough enough to take every blow).
  - spawn_actor: {monster_id: 150, near_party: true}
  - grant_item: {item_id: 42, member_index: 1, equip: main_hand, rarity: 1, item_power: 20, drop_level: 20}
  - party_attack: {actor_index: last, member_index: 1, count: 20, record: first_blows, report: true}
  - party_attack:
      actor_index: last
      member_index: 1
      count: 60
      ratio_to: first_blows
      applied_ratio: [1.3, 4.0]
      report: true
