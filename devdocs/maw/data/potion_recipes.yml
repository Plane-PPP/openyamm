# draft extracted from MAW ef23ee17
# MAW alchemy: the complete mix matrix and the reagent table. Not loaded by anything.
# Source of the matrix: POTION.TXT inside Data/zMaw.T.lod (extracted with scratch lodx.py; MM8 LOD, zlib entries).
# Every cell that is not listed below is "no" (the mix is refused, nothing is consumed): 174 directed numeric cells
# = 87 unordered recipes, 9,826 "no" cells, zero E1-E4 explosion cells (OpenYAMM's current english/potion.txt has
# 616 numeric, 2,987 E3, 1,153 E4, 42 E2, 30 E1 and 72 "no" directed cells over 70 columns).
# The matrix is symmetric (a+b == b+a for every recipe).
# 'mastery' is the Required mastery column of Data/Tables/Potion settings.txt for the RESULT. The engine's own
# mastery check is not overridden by MAW: mixing a result above the mixer's Alchemy mastery fails as in base
# MMMerge (OpenYAMM models it as an explosion of level = required mastery, InventoryItemMixingRuntime.cpp:70-85).
# Power of a mix = engine average of the two inputs (OpenYAMM averagePotionPower, InventoryItemMixingRuntime.cpp:53-56).
# Colour shorthand: Red 222, Blue 223, Yellow 224, Orange 225, Purple 226, Green 227, Gray/Catalyst 221.
# Structure: 3 secondary (base x base) + 12 tertiary (9 base x secondary, 3 secondary x secondary)
#            + 36 white (secondary x tertiary) + 36 black (base x white) = 87.

reagents:
  # power_base: the value MAW's mawTick_ReagentPower writes into Mod1DiceCount (zzAlchemy.lua:587-599);
  # items_txt_mod1: the LOD ITEMS.txt Mod1 (used only until the first tick resets it: top tier 50, gray 75).
  # result: potion made by reagent + empty bottle (220), from Reagent settings (OpenYAMM reagent_settings.txt).
  power_formula: >-
    reagentPower = floor(base * (1 + B*0.25/20) + 0.75*B) when B > 0, else base;  B = reagent item Bonus (item level)
    + 0.5*s at Alchemy Master, + s at Grandmaster (s, m of the CURRENT player); capped at 255; the excess over 255,
    halved and floored (max 900), is added to that player's Alchemy skill while the reagent is held
    (zzAlchemy.lua:601-639). Potion power then = reagentPower + the engine's Alchemy skill (GetSkill, clamped to 2x
    the cap of 60 = 120, plus the hidden excess). Tooltip shows round(...) without the Alchemy part
    (MawCore/Tooltip.lua:134-139).
  item_level:
    generated: "Bonus = min(floor(getPartyLevel()/5), 255); not on map index 0, not Strength 7 (zzAlchemy.lua:641-651)"
    monster_drop: "Bonus = round(getPartyLevel()/2) (REAGENT_LEVEL_DIVISOR, zzAlchemy.lua:296, 683-684)"
    party_level: "getPartyLevel() = sum of vars.MMLVL of the OTHER continents (zzzMaw_Experience.lua:278-289)"
  drops:
    chance: "best party Alchemy mastery m >= Master: (m-2)%  -> Master 1 %, GM 2 % per kill (zzAlchemy.lua:654-671)"
    tier: "round(clamp(monsterBaseLevel/20 * (1.75 + rand/2), 1, 5)) (zzAlchemy.lua:673-674)"
    pick: "uniform among the 8 reagents of that tier (MM8 and MM7 sets), reagentDropTable zzAlchemy.lua:700-705"
    ready_potion: >-
      if Bonus + best_s*best_m/2 > 200 the drop becomes a random potion 221-224 with power Bonus + s*m/2
      (s and m are the best skill and best mastery, possibly from different members; zzAlchemy.lua:677-689)
    endless_potion: >-
      best mastery GM: 0.2 % per kill, item 1069, BonusStrength = min(best_s + 10, 100)
      (zzAlchemy.lua:690-697)
    none_from: "reanimated monsters (Ally 9999)"
