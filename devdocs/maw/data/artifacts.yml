# ---------------------------------------------------------------------------------------------------------------------
# open questions / bugs
#
# 1. Counts. mawArtifacts (zzMaw-Items.lua:4481) has 104 entries and 103 unique ids, not 98. 98 is the number of
#    artifactPower entries (zzMaw-Items.lua:3514-3834): 96 of them are in the drop list, 532 and 543 are not.
#    Seven drop-list ids have no artifactPower entry: 508, 511, 542, 1309, 1310, 1311, 1315.
# 2. 533 is listed twice and 532 is missing between 531 and 534 (532 has an artifactPower entry): probably a typo
#    for 532. The duplicate owns two pity slots, so Last Stage Cuirass drops about twice as often. vars.artPity is
#    indexed by list position, so any edit to the list shifts every saved counter onto a different artifact.
# 3. Vampiric on artifacts (508, 527, 2020) does nothing: MawArtifactVampiric is read only by the old
#    ItemAdditionalDamage hook, which disables engine vampirism and fills gotVamp/gotBowVamp, which nothing reads.
#    lifeLeech only checks Bonus2 16/41 (zzMaw-Items.lua:3248-3270). The tooltip still prints "Vampiric".
# 4. Reference AC for artifact armour is the last row of the NotIdentifiedName run. MM8 artifacts have unique names
#    ("Artifact Plate Armor"), but MM7 1302-1315 are all "Artifact" (reference = 1315 Ruler's Ring = 0), 1316-1330
#    all "Relic" (reference = 1330 Mekorig's Hammer = 17), MM6 2020-2034 "Artifact" (2034 Morgan = 3) and
#    2035-2049 "Relic" (2049 Hera = 6). Yoruba (plate, 70 printed AC) gains nothing with level while Supreme Plate
#    gains up to 80 * 2.5 = 200.
# 5. The tooltip scales AC for artifacts outside artArmors (1325, 2029, 2032, 2033, 2034, 2044, 2047, 2048, 2049),
#    the character sheet does not (Tooltip.lua:546-554 versus zzMaw-Items.lua:2698-2705).
# 6. Artifact resistances are priced as resistance enchants (ring halving included) but are added to the base
#    resistance stat, a much weaker channel at high monster level than vars.normalEnchantResistance.
# 7. Weapons outside artWeap1h/2h read a ladder tier instead of tier 6: 531 (3.5, flat 8), 532 (3.5, flat 8),
#    1317 (1.357, flat 1.143). artWeap1h holds two-handed 1303 and 1333; artWeap2h holds one-handed 867 and 1667.
#    The list choice only matters for the legacy dice upscaler.
# 8. Effects printed in MAW ITEMS.txt notes with no table rule (the tooltip strips the note's leading parenthesis):
#    Swift on 504 (zzzMaw_Artifacts.lua:90 claims it lives elsewhere), 506, 512, 518, 532; Immunity to Sleep 518;
#    immunities on 511 and 534; Immune to Fear 537; Shielding 511; Feather Falling 522, 1331, 1338; Water Breathing
#    528; Water Walking 1318 and 1338 (both get WaterBreathing instead); Undead slaying 1329. 511 Staff of the Swamp
#    and 1311 Charele have no rule data at all.
# 9. mawArtifactsKeep is entirely commented out; quest/obelisk artifacts survive the chest re-roll only when their
#    Value is under 20000. The re-roll runs on every map load and goes through the item generator, so the
#    replacement can itself roll an artifact and advances the pity counter.
# 10. BonusExpireTime = level is written on every dropped artifact and never read; level is always live.
# 11. drop.multiplier is always 1 (LootContext.set never passes it), so 0.005 * multiplier and the pity increment
#     by multiplier are dead parameters.
# 12. artifactPowerMult and replaceNumber are dead; the init dice upscaler is half-dead: it no longer drives damage
#     but still doubles/triples Mod2, which the weapon-skill AC/resistance bonus (Staff, Sword, Spear) reads.
# 13. SP regen tooltip prints half the applied artifact rate (zzMaw-Stats.lua:410-417 vs zzMAW-Skills.lua:1460).
# 14. Splitter and Thor call CastSpellDirect(125, ...); spell 125 is "Wing Buffet" in mmmerge Spells.txt. Purpose
#     unclear (visual or sound?). Hades' Acid Burst is cast with no target coordinates.
# 15. zzzMaw_Artifacts.lua comments name the reference enchant "of Carnage" (lines 30, 168-169); enchant 46 is
#     "of The Dragon" in MAW SPCITEMS.TXT, Carnage is 3.
# 16. Ranged on-hit test reads data.Object.Spell == 133 but data.Spell == 135 (zzzMaw_Artifacts.lua:544).
# 17. Artifact skill bonuses obey the 2 x base skill cap, so a +3-unit Meditation (1317) or Learning (1324) bonus is
#     worth nothing without base skill; spell-school bonuses (base * 0.5) are not rounded.
# 18. Cycle of Life and drains run once per worn instance; two 543 rings share twice per tick.
# 19. OpenYAMM items.txt equals base MMMerge, not MAW, for 1309, 1310, 1311, 1329, 2020 (dice/Mod2) and 1326, 1337
#     (Mod1/Mod2 0 0 versus MAW 1 19 and 1 24). Weapon dice only change the legacy paths, but 1326/1337 lose 20 and
#     25 printed AC and 1337 its whole reference AC (its run is itself). Notes text is base MMMerge everywhere.
# 20. 542 Noblebone Bow has material Special: OpenYAMM ItemRuntime (and MMMerge rules keyed on material) do not see
#     it as an artifact although MAW drops it as one.
# ---------------------------------------------------------------------------------------------------------------------
