# draft extracted from MAW ef23ee17
#
# MAW (Might and Magic Merge mod) artifact rules, as data, for a future native OpenYAMM "MAW ruleset".
# Source: /home/pjasicek/github/Maw-Mod-MMMerge at ef23ee17. Paths are relative to its Scripts/; "General/" and
# "Modules/MawCore/" are dropped from file names below (zzMaw-Items.lua, zzzMaw_Artifacts.lua, Artifacts.lua,
# ItemLevel.lua, Formulas.lua, Estimates.lua and Tooltip.lua are unique names). Numbers are copied, not rounded.
#
# Units
#   One budget coefficient unit = one enchant of a perfectly rolled Epic on the same slot at the same level:
#     stat_unit(L, id)  = encStrUp(GetLootTier(L)) * GetDifficultyExtraPower() * GetSlotMult(id)
#                         (Artifacts.lua:65-73)
#     skill_unit(L, id) = ceil(max(u^0.5, u/10)) * GetSlotMult(id), u = encStrUp(GetLootTier(L)) * difficulty
#                         (Artifacts.lua:77-80, Formulas.lua:21-23)
#   A perfect Epic is the top of ENCHANT_STRENGTH_DEFAULT {Min 8, Max 20} / ENCHANT_STRENGTH_DIV 20 = 1.0
#   (zzMaw-Items.lua:673-674), so one unit is exactly encStrUp * difficulty * slot. A whole artifact is meant to be
#   Artifacts.Slots = 3 units (Artifacts.lua:44); negative coefficients are drawbacks.
#   Worn value per stat = round(coeff * stat_unit) after the read transform (Artifacts.lua:102-140):
#     resistances (FireResistance..BodyResistance): on a ring (EquipStat 10) value * 100 / 200 (Formulas.lua:12-19)
#     HP and SP: value * (1 + min(value / 50 / slot_mult, 5)) (Formulas.lua:25-30)
#     skills: round(coeff * skill_unit); Flat entries are added after rounding, untransformed.
#   round(x) is floor(x + 0.5) (zz_Maw-initialize.lua:315-322).
#
# Artifact level
#   level = getTotalLevel() = vars.MMLVL[1] + [2] + [3] + [4], the party's summed per-continent levels
#   (ItemLevel.lua:61-66, zzzMaw_Experience.lua:262-272). It is read live on every use, so an artifact scales with
#   the party forever; the level written into BonusExpireTime at drop time is never read back (see rules.level).
#
# Drop, pity and selection
#   Any generated base (enchantable) item outside shops can become an artifact with
#   p = 0.005^(1.38 - 0.005 * failures * 0.5) (zzMaw-Items.lua:1006-1033, 4471-4478). failures counts misses since the
#   last artifact; p starts at 0.000668, equals 0.005 at 152 failures and reaches 1 at 552. Mean wait 196 rolls.
#   The id is picked from mawArtifacts with get_affix: weight of list slot k = 1 / (N * (count_k + 1)), N = 104
#   list slots, count_k = how often slot k was rolled before (zzMaw-Items.lua:1372-1401).
#
# Chest re-roll
#   On every map load a chest item that is in mawArtifacts, has MaxCharges 0, BonusStrength 0 and ITEMS.txt
#   Value >= 20000 is replaced by Randomize(6, 0) through the boss loot path (zzMaw-Items.lua:4523-4535).
#   The exemption list mawArtifactsKeep (zzMaw-Items.lua:4489-4521) is entirely inside a --[[ ]] comment, so it is
#   empty; it lists MM6 2032 2033 2034 2023 2020, MM7 1340 1343 1351 1337 1338 1335 1336 1333 1334, MM8 501 503 541
#   519 542 516 539 540 504 508 509 as guaranteed quest/obelisk/chest rewards. Today only the Value < 20000 ids
#   (502 505 507 542 1332-1338) survive.
#
# Conventions: an absent key means the artifact has no such rule. "source" is file:line at ef23ee17.
# Item ids are OpenYAMM items.txt ids; they equal the MMMerge/MAW ITEMS.txt ids for every entry (checked).
# Per entry: name/equip_stat/skill/material are MAW ITEMS.txt (zMaw.T.lod) values; budget is artifactPower;
# base describes the base damage or AC model (rules.weapon_damage / rules.armor_class), with slot_mult from
# GetSlotMult and the default base_multiplier 1; maw_note is the power list printed in MAW's ITEMS.txt note. Those
# note numbers are legacy text, not live values: the tooltip strips the note's leading "(...)" or "(Special ...)"
# part and prints lines generated from the tables instead (Tooltip.lua:495-534).

rules:
  artifact_tests:
    is_artifact_id:
      ranges: [[500, 543], [1302, 1354], [2020, 2049]]
      source: "zzMaw-Items.lua:101-103"
    is_artifact_item:
      rule: "IsArtifactId(id) or id in artWeap1h/artWeap2h or id in artArmors"
      source: "zzMaw-Items.lua:2679-2688"
    rarity_decoder_set:
      rule: "ids in mawArtifacts; their BonusExpireTime without the rarity marker reads as no rarity"
      source: "zMaw_ItemBits.lua:118-144"
    enchantable_excludes:
      rule: "IsBaseItemId(id) and id not in ancientWeapons; artifacts never take random enchants"
      source: "zzMaw-Items.lua:95-112"

  level:
    artifact_level: "getTotalLevel() when vars.MMLVL exists, else MaxCharges * 5"
    source: "ItemLevel.lua:61-66; zzzMaw_Experience.lua:262-272"
    on_hit_level: "MawArtifactLevel() = getTotalLevel(), 0 before a game exists"
    on_hit_level_source: "zzzMaw_Artifacts.lua:445-453"
    drop_writes_bonus_expire_time: "min(max(round(getTotalLevel()), 1), 1000)"
    drop_writes_source: "zzMaw-Items.lua:1024-1025"
    drop_level_is_read: false  # DecodeRarity returns zeros for an artifact without the marker (zMaw_ItemBits:143)
    tooltip_line: "Artifact Level: round(level)"
    tooltip_source: "Tooltip.lua:532-533"
    wear_level:
      formula: "max(1, floor(d - (10 + 0.09 * d) - 6 [bolster >= 300] - 3 [Doom] - 3 [insanity]))"
      d: "GetItemDropLevel (0 for artifacts) + TierLevels(id) = (clamp(ladder_tier, 1, 6) - 1) * 3"
      result: "1 to 3 for every artifact"
      source: "zzMaw-Items.lua:4351-4373; ItemLevel.lua:54-59, 70-75"

  budget:
    slots: 3
    slots_source: "Artifacts.lua:44"
    enchant_unit: "encStrUp(GetLootTier(level)) * GetDifficultyExtraPower()"
    enchant_unit_source: "Artifacts.lua:65-67"
    loot_tier: "level / TIER_LEVELS + min(1 + level / TIER_LEVELS, LOOT_STRENGTH_MAX)"
    tier_levels: 15
    loot_strength_max: 6
    loot_tier_source: "zzMaw-Items.lua:482-490, 889"
    enc_str_up_normal: "tier <= 12: 1 + tier * 2; else 25 + min((tier - 12) * 3, 75)"
    enc_str_up_normal_source: "zzMaw-Items.lua:444-449"
    enc_str_up_austerity: "tier <= 30: tier + 2; else 32 + (tier - 30) * 2"
    enc_str_up_austerity_source: "zzMaw-Items.lua:451-456, 895-901 (vars.AusterityMode, set on BeforeLoadMap)"
    # derived (normal mode, difficulty 1): level -> encStrUp / skill unit before slot multiplier
    derived_units: {0: [3, 2], 15: [7, 3], 75: [23, 5], 100: [27, 6], 150: [37, 7], 300: [67, 9], 465: [100, 10]}
    difficulty_power: {insanityMode: 1.2, Doom_vars_Mode_2: 1.1, trueNightmare: 1.05, default: 1}
    difficulty_source: "zzMaw-Items.lua:552-561"
    slot_mult_by_equip_stat:
      {weapon_1h: 1, weapon_2h: 2, bow: 1.25, armor: 1.5, shield: 1, helm: 1.25, belt: 1, cloak: 1, gauntlets: 1.25,
       boots: 1.25, ring: 0.75, amulet: 1}
    slot_mult_hat: "helm with Mod2 == 0: 1.25 * 1.5 = 1.875"
    slot_mult_source: "zzMaw-Items.lua:1405, 4407-4425"
    skill_unit_formula: "ceil(max(u^0.5, u / 10)) * slot_mult"
    skill_unit_source: "Artifacts.lua:77-80; Formulas.lua:21-23"
    resistance_transform: "ring: value * 100 / ringReductionDivisor(200); other slots unchanged"
    resistance_transform_source: "Artifacts.lua:85-88, 118-119; Formulas.lua:12-19"
    vitality_transform: "value * (1 + min(value / vitalityEnchantHalfPoint(50) / slot_mult, vitalityEnchantCap(5)))"
    vitality_transform_source: "Artifacts.lua:92-94, 120-121; Formulas.lua:25-30"
    rounding: "stats and skills rounded per entry; Flat added after rounding"
    rounding_source: "Artifacts.lua:123, 128, 133-137"
    application: "stats into item-stat slot const.Stats id + 1; skills into slot skill id + 50"
    application_source: "zzMaw-Items.lua:2797-2808"
    resistance_channel_note: >-
      Artifact resistances land in the base resistance stat (damage taken 1 / (res / (100 + 12 * monsterLevel) + 1)),
      not in vars.normalEnchantResistance (1 / (res / 100 + 1)) where real resistance enchants go
      (zzMaw-Items.lua:2743-2750, zzMaw-Stats.lua:1113-1135, Formulas.lua:65-74).
    skill_cap: "a skill's total (base + all item bonuses) is capped at 2 x base skill level"
    skill_cap_source: "zzMaw-Items.lua:2605-2611"
    base_stat_multiplier_default: 1  # no artifactPower entry sets baseStatMultiplier at ef23ee17
    base_stat_multiplier_source: "Artifacts.lua:145-148"
    tooltip: "one line per stat and skill from BonusesOf, then MawArtifactOnHitText lines"
    tooltip_source: "Tooltip.lua:495-534"

  weapon_damage:
    # artifact weapons (artWeap1h/artWeap2h) are "a tier-6 weapon at item level = party total level"; printed
    # Mod2 and dice sides are ignored, only Mod1DiceCount is read.
    item_power: "power = min(floor(max(level, 0) / 5), 100)  # PerPower 5, POWER_CAP 100: growth stops at level 500"
    item_power_source: "ItemLevel.lua:4-21; Estimates.lua:123"
    tier_flat: "WEAPON_TIER_FLAT_DAMAGE(16) * (clamp(tier, 1, 6) - 1) / 5; artifact weapons use tier 6 = 16"
    tier_flat_source: "Estimates.lua:99-105; zzMaw-Items.lua:4562-4567"
    rows: >-
      flatPower = floor(power / 2); powerFlat = 2 * flatPower; powerDice = 2 * 2 * (power - flatPower);
      diceOnly = 8 * 2 + powerDice; flatOnly = tier_flat + powerFlat; one-handed halves both
    rows_source: "Estimates.lua:98-139"
    character_rows: >-
      attack/flat bonus = flatOnly * base_mult * quality; die sides = diceOnly / max(dice_count, 1) * base_mult *
      quality
    character_rows_source: "zzMaw-Items.lua:4585-4593"
    two_handed: "EquipStat == 1 (Weapon2) or id in twoHandedAxes (axes with EquipStat 1)"
    two_handed_source: "zzMaw-Items.lua:4555-4557; zzMAW-Skills.lua:1822-1837"
    displayed_range: "min = dice_count + round(bonus); max = dice_count * round(sides) + round(bonus)"
    displayed_range_source: "zzMaw-Items.lua:4598-4603"
    quality_mult: "1 + cube_quality / 100; Pandora's Cube adds CUBE_QUALITY_STEP_ARTIFACT = 2 per use, max 20"
    quality_source: "zzMaw-Items.lua:727, 738-746; zMaw_ItemBits.lua:254-269; zzAlchemy.lua:847-868"
    blaster_rule: "a blaster in the main hand disables the offhand weapon, except for ancientWeapons themselves"
    blaster_rule_source: "zzMaw-Items.lua:2816-2820"

  armor_class:
    applies_to: "ids in artArmors whose skill is Shield/Leather/Chain/Plate, or Misc with EquipStat != 12"
    formula: "ceil((Mod1DiceCount + Mod2 + round(reference_ac * power / 40)) * base_mult), then round(* quality)"
    power: "min(floor(level / 5), 100)"
    reference_ac: >-
      Mod2 + Mod1DiceCount of the LAST item in the run of consecutive ITEMS.txt rows that share this row's
      NotIdentifiedName (built once for ids 0-2199)
    source: "zzMaw-Items.lua:2614-2633, 2692-2717; Formulas.lua:291-294"
    legendary_28: "acBonus * 1.5 after it has been added to armorAC/shieldAC"
    legendary_28_source: "zzMaw-Items.lua:2713-2715"
    non_list_items: "artifacts not in artArmors keep the printed Mod1DiceCount + Mod2 (MaxCharges is 0)"
    tooltip_mismatch: >-
      The tooltip scales AC for every IsArtifactId item with skill 8-11 or 40, using reference_ac or the printed AC
      (Tooltip.lua:537-555), so non-artArmors artifacts print more AC than they give.

  drop:
    base_chance: 0.005
    chance_multiplier: "drop.multiplier, always 1 (LootContext.set never passes multiplier)"
    chance_source: "zzMaw-Items.lua:128-159, 304-308, 1008"
    pity: "pity_chance(c, f) = 1 if c >= 1 else c^(PITY_EXPONENT - c * f * 0.5); PITY_EXPONENT = 1.38"
    pity_source: "zzMaw-Items.lua:4467-4478"
    pity_counter: "vars.artifactRollPity, += drop.multiplier per miss, reset to 0 on success"
    pity_counter_source: "zzMaw-Items.lua:1009-1012, 1031"
    derived: {p_at_0: 0.000668, p_at_100: 0.002511, p_at_152: 0.005, p_at_300: 0.03551, p_at_500: 0.5022,
              certain_after_failures: 552, mean_rolls: 196}
    eligible_items: "IsEnchantableItem(t.Item) and not in a shop (HouseScreen 2 or 95)"
    skipped: "Map.MapStatsIndex == 0, t.Strength == 7 (engine artifact roll), screens 16 and 21"
    eligibility_source: "zzMaw-Items.lua:974, 998-1007"
    selection: "get_affix(vars.artPity): weight_k = 1 / (N * (vars.artPity[k] + 1)), N = #mawArtifacts = 104"
    selection_source: "zzMaw-Items.lua:1013-1023, 1372-1401"
    pity_slots_are_positions: true  # vars.artPity is indexed by list position; 533 owns two slots
    on_success: "Number = artifact; BonusExpireTime = level; BonusStrength, Bonus2, Bonus, Charges = 0"
    on_success_source: "zzMaw-Items.lua:1023-1029"
    rng: "math.randomseed(vars.SeedList[base item number]) before the roll (save-seeded)"
    rng_source: "zzMaw-Items.lua:987-996"

  chest_reroll:
    trigger: "events.AfterLoadMap, every load, all chests"
    condition: >-
      MaxCharges == 0 and id not in mawArtifactsKeep and id in mawArtifacts and ITEMS.txt Value >= 20000 and
      BonusStrength == 0
    action: "LootContext.markBoss(); Randomize(6, 0)"
    keep_list: []  # all entries commented out, zzMaw-Items.lua:4489-4521
    source: "zzMaw-Items.lua:4523-4535"

  on_hit:
    # artifactOnHit, stage "artifact-on-hit" of the damage pipeline: after "legendaries", before "damage-taken"
    stage_source: "Damage.lua:1494-1496, 1532"
    reference_enchant: 46  # enchantbonusdamage[46] = {20, 40, Type 0, Coeff 0.5}, "of The Dragon" in SPCITEMS.TXT
    reference_enchant_source: "zzMaw-Items.lua:2061; zzzMaw_Artifacts.lua:445"
    level_damage: >-
      getWeaponLevelDamage(L, two_handed, tier_flat) = ((levelDamage + arms) * (1 + 0.02 * estimateSkill(L))
      + statFlat) * (1 + GetMightDamageMultiplier(estimateStat(L), L)); levelDamage from the weapon rows,
      arms = armsmaster damage at estimateSkill(L) * 1.5, statFlat = GetStatisticEffect(estimateStat(L)); arms and
      statFlat halve for one-handed weapons
    level_damage_source: "Estimates.lua:68-70, 120-158, 522"
    range: >-
      avg = level_damage * 0.5 * ENCHANT_DAMAGE_MULT(1); lo = max(avg * 20 / 30, 20 * f); hi = max(avg * 40 / 30,
      40 * f); f = (two_handed ? 2 : 1) * ENCHANT_FLOOR_SHARE(0.5)
    range_source: "zzMaw-Items.lua:2063-2082"
    hit_damage: "random integer in [round(lo), round(hi)] * Damage * pace * MultVs[kind] / 2^(res / 100)"
    pace: "GetPlayerBaseRecovery(pl, it) / 100: bow = its recovery, melee = mean recovery of held weapons (skill < 8)"
    resistance: "target Resistances[index of DamageKind] % 1000; no DamageKind = Phys, still resisted"
    monster_kind: "Game.Bolster.Monsters[monster.Id].Type, const.MonsterKind redefined by MAW"
    hit_damage_source: "zzzMaw_Artifacts.lua:455-518; zzMaw-Items.lua:2106-2122; AdaptiveMonstersStats.lua:20-59"
    slots: "melee (no Object, DamageKind 4): items in slots 0 and 1; ranged (Object.Spell 133 or Spell 135): slot 2"
    elemental_share: "non-Phys on-hit damage is added to t.ElementalDamage for the spell leech"
    slots_source: "zzzMaw_Artifacts.lua:523-550"
    broken_items: "an item with it.Broken deals no on-hit damage and casts nothing"
    spell_power: "castAt and the skill/mastery passed: wielder's skill in the item's Skill, or 7/3 for Skill >= 39"
    spell_power_source: "zzzMaw_Artifacts.lua:52-64"
    tooltip: "+round(lo * Damage)-round(hi * Damage) <kind> damage on hit; x<factor> damage vs <kinds>; Vampiric"
    tooltip_source: "zzzMaw_Artifacts.lua:344-372"
    dps_estimate: "MawArtifactOnHitPower (average, no MultVs, no resistance) is added to the sheet's DPS"
    dps_estimate_source: "zzzMaw_Artifacts.lua:468-474; zzMaw-Stats.lua:1209-1234"

  vampiric:
    flag_reader: "MawArtifactVampiric(id) is only read by events.ItemAdditionalDamage, which sets t.Vampiric = false"
    effect: "none: lifeLeech only checks Bonus2 16/41 (zzMaw-Items.lua:3248-3270); gotVamp/gotBowVamp are never read"
    source: "zzzMaw_Artifacts.lua:283-286; zzMaw-Items.lua:2460-2491"

  leech:
    rule: "artifactLeech values are summed and added to lifeLeech[index].Melee only (ranged and spell untouched)"
    source: "zzzMaw_Artifacts.lua:608-614; zzMaw-Items.lua:3221-3271"

  drain:
    rule: "per events.RegenTick, per worn item: HP += drain.HP unless pl.Class == ExemptClass"
    tick_condition: "skipped for main condition 14, 15, 16 (dead, petrified, eradicated); capped at full HP"
    source: "zzzMaw_Artifacts.lua:560-566, 602-625"

  cycle_of_life:
    item: 543
    trigger: "events.RegenTick, per worn instance (two rings run it twice)"
    skip: "Party.count == 1, wearer main condition 14 or 16, or wearer HP >= full HP"
    algorithm: >-
      donors = members with HP above the wearer; mid = floor((wearer.HP + sum(donor.HP)) / (1 + #donors));
      need = mid - wearer.HP; each donor loses floor(min(max(donor.HP - mid, 0), need) / 2); the wearer gains the
      sum of those losses; a positive result clears Conditions[13] (unconscious)
    source: "zzzMaw_Artifacts.lua:568-600, 616-625"

  wear_requirements:
    hook: "events.CanWearItem: t.Available = false when Check(player) fails"
    source: "zzzMaw_Artifacts.lua:628-726"
    wetsuit_1406:
      check: "doll type shows armor; equipped slots 0, 2, 4, 5, 6, 8 empty; main hand not EquipStat 1"
      while_worn: "only EquipStat 0, 3, 8, 10, 11 items may be equipped"
      source: "zzzMaw_Artifacts.lua:688-721"

  buffs:
    refresh: "every 2000 ms (Scheduler), for each worn item listed: ExpireTime = max(ExpireTime, now + 3 game min)"
    power: "Power and Skill raised to the listed value when lower; OverlayId = 0"
    horn_of_ros_2055: "any party member carrying item 2055 anywhere: party DetectLife refreshed at power 3"
    source: "zzzMaw_Artifacts.lua:728-794"

  immunities:
    hook: "events.DoBadThingToPlayer: t.Allow = false when a worn artifact lists t.Thing"
    source: "zzzMaw_Artifacts.lua:796-848"

  attack_speed:
    rule: "events.GetAttackDelay: t.Result *= (mod / 2 + 100) / 100 per worn listed item; mod -20 -> x0.9"
    floor: "t.Result = max(t.Result, 0)"
    source: "zzzMaw_Artifacts.lua:850-871"

  hp_regen:
    rule: "per worn listed item: + FHP * 0.02 / 10 HP per second = 0.2 % of max HP per second"
    tick: "10 ticks per second; x2 after 200 undamaged ticks, x4 with no enemy detected (stacking to x8)"
    source: "zzMaw-Items.lua:3836; zzMAW-Skills.lua:1358-1362, 1395-1409"

  sp_regen:
    rule: "per worn listed item: + FSP * 0.02 / 100 SP per tick = 0.2 % of max SP per second, same tick multipliers"
    source: "zzMaw-Items.lua:3837; zzMAW-Skills.lua:1433-1465"
    tooltip: "prints (ceil(FSP * n * 0.01) + 1) / 10 per second, half the applied rate"
    tooltip_source: "zzMaw-Stats.lua:402-418"

  spell_bonus:
    rule: "events.GetSkill: + base_skill_level * ARTIFACT_SPELL_SKILL_BONUS per worn artifact listing that school"
    bonus: 0.5
    not_rounded: true
    cap: "total skill capped at 2 x base level"
    tooltip: "+50% skill in <schools>"
    source: "zzMaw-Items.lua:2587-2611, 3839-3875; zzzMaw_Artifacts.lua:374-383"

  legacy_dead_code:
    artifact_power_mult:
      formula: >-
        customLevel >= 1: level = max(customLevel * 1.5, customLevel + 50); bol = (max(BolsterAmount, 100) / 100 - 1)
        / 20 + 1; cap 550 (900 madness, 1500 with customLevel); mult = (min(level, cap) / 200 + 0.75) * bol, AC
        variant / 250
      used_by: "replaceNumber only, which nothing calls; the CalcStatBonusByItems user is commented out"
      source: "zzMaw-Items.lua:2369-2377, 2383-2417, 4049-4072"
    init_dice_upscaler:
      rule: >-
        GameInitialized2: artWeap1h sides = (sides + 1) * 2 - 1 and Mod2 * 2; artWeap2h sides = (sides + 1) * 3 - 1
        and Mod2 * 3
      still_read_by: >-
        Game.ItemsTxt Mod2 in addWeaponACRes (weapon-skill AC/resistance for Staff, Sword, Spear: bonusBase = Mod2)
        and referenceWeaponAttack; the damage model reads only Mod1DiceCount
      source: "zzMaw-Items.lua:2329-2346, 3226-3246, 2614-2633"
    commented_artifact_text: "zzMaw-Items.lua:2348-2367 (artifactTextBuilder, commented out)"
    extra_artifacts_lua: "Global/ExtraArtifacts.lua ships empty to override the MMMerge file"
    count_item_bonuses_stub: "Game.CountItemBonuses = function() end (zzzMaw_Artifacts.lua:880)"

  lists:
    art_weap_1h: [500, 501, 502, 503, 504, 506, 507, 508, 509, 510, 512, 523, 524, 526, 527, 528, 529, 538, 539, 542,
                  1302, 1303, 1304, 1305, 1308, 1310, 1311, 1312, 1316, 1319, 1328, 1329, 1330, 1333, 1340, 1342, 1343,
                  1344, 1345, 1353, 1354, 2020, 2021, 2023, 2025, 2035, 2036, 2037, 2038, 2040, 2118, 1666, 866]
    art_weap_1h_source: "zzMaw-Items.lua:2330"
    art_weap_2h: [505, 511, 525, 530, 540, 541, 1309, 1320, 1351, 2022, 2024, 2039, 1667, 867]
    art_weap_2h_source: "zzMaw-Items.lua:2331"
    art_armors: [513, 514, 515, 516, 517, 518, 520, 522, 533, 534, 1306, 1307, 1313, 1314, 1318, 1321, 1322, 1323,
                 1324, 1326, 1327, 1331, 1332, 1334, 1335, 1336, 1337, 1346, 1349, 1350, 1352, 2026, 2027, 2028, 2030,
                 2031, 2041, 2042, 2043, 2045, 2046]
    art_armors_source: "zzMaw-Items.lua:2332"
    ancient_weapons: [866, 867, 1666, 1667]
    ancient_weapons_source: "zzMaw-Items.lua:2382"
    hp_regen: [509, 520, 1337, 1331, 1335, 2027]
    sp_regen: [513, 1334, 1331, 2024, 2032, 2033, 2034]
    regen_source: "zzMaw-Items.lua:3836-3837"

  openyamm_material:
    parser: "items.txt column 9 (material) 'Artifact' / 'Relic' / 'Special' -> ItemRarity, anything else Common"
    parser_source: "OpenYAMM game/tables/ItemTable.cpp:247-266, 420-422; game/tables/ItemTable.h:26-32"
