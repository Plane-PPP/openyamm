openyamm_today:
  # game/gameplay/GameplayActorService.cpp tryApplySharedSpellEffect (from line 303)
  resistance_check: "canApplyMmergeStatusSpell: 100 + skill + 2.5 * mastery > resistance, never at >= 200 (line 80)"
  durations: "per spell, skill-scaled vanilla minutes (slow 3-5 min per point, paralyze 3 min per point, ...)"
  dr: none
