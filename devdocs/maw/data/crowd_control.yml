     note: "not duration-scripted: MAW only rolls success; chance = 30 / (30 + L / 4),
       L = max(round(((level / 4 + res + 30) / (1 + 0.01 s) - 30) * 4), 0), x2 L on bosses, x (1 - affix13 / 100);
       on success the MMMerge hook paralyses 1 game min + s*m ticks (TW:50-58)",
     source: "DM:334-357, SP:1855-1865"}
