# draft extracted from MAW ef23ee17
# Buff rework ("Buff Rework ON", the only working mode): every buff spell is a toggled, party-wide aura that
# reserves part of the caster's mana pool. Spec: ../CLASSES_SPELLS_SPEC.md section 3.
# Sources: Scripts/General/zzMaw-Spells.lua (SP:line), zzMaw-Items.lua (IT:line), zzMaw-Stats.lua (ST:line),
# zzMAW-Skills.lua (SK:line), Scripts/Modules/MawCore/Formulas.lua (FO:line), zzMaw-Timers.lua (TI:line).
#
# Units: percentages are whole percent unless named *_fraction. s = holder's school skill (base skill only:
# player.Skills[school], no item bonus, SP:3098-3099) capped at skill_caps; m = holder's school mastery 1..4;
# level = holder LevelBase. A buff with no live source reads s = m = level = 0.

reservation:
  # SP:2761-2785 (cast check, tooltip) and SP:3010-3063 (buffManaLock, the real deduction)
  percent_of_max_pool: "cost / (class_sp_factor + enlightenment_mastery / 2)"
  class_sp_factor: "Game.Classes.SPFactor snapshot at GameInitialized2 (Class HP SP.txt column SPFactor)"
  # SP:2586-2598
  class_sp_factor_overrides: {56: 3, 57: 6, 58: 9, 59: 1, 60: 1.5, 61: 2, 34: 7.5, 35: 7.5, 36: 7.5, 37: 7.5}
  enlightenment_skill_id: 52  # Skillz extended skill; mastery 0..4
  pool: "GetFullSP() at the time of buffManaLock; SP is clamped to pool - sum(reserved) (SP:3060, SK:1478-1481)"
  utility_flat_cost: "round(cost * (1 - enlightenment_mastery / 10)) (SP:3048-3049); the cast check uses round(cost)"
  legendary_32: "reserves HP instead (divisor = class HPFactor + m/2, pool = full HP) (SP:2768-2779, 3035-3042)"
  exempt_classes: "Death Knight 56-58 and Thief line 34-37: pool reset to full, nothing reserved (SP:3055-3058)"
  cast_check: "currentManaPool (max - already reserved) >= cost, skipped inside a house (SP:2823-2831)"
  meditation_pool_shrink: "SP regen pool = ceil(fullSP * (1 - reservedShare)^0.5) (FO:208-219)"
  example_percent_table: "see CLASSES_SPELLS_SPEC.md 3.2 (Lua run)"

lifecycle:
  toggle_on: "cast by a member who does not hold it: holder := that member (ownership moves),
    recovery = getSpellDelay (SP:2788-2850)"
  toggle_off: "cast again by the holder: off, status 'Buff Disabled', remote re-apply ignored for
    1.5 game min (SP:2851-2860)"
  remove_all: "R key on the spellbook screen clears every aura, including temple/scroll ones (SP:22-27)"
  duration: "ExpireTime := now + 1 week on every apply (SP:2900)"
  reapply_interval_seconds: 0.5  # MawAddTimer("mawBuffApply", 0.5), TI:95; also on LoadMap, cast, multiplayer sync
  unconscious_holder: "not applied while the holder is not conscious, reservation stays, resumes on recovery
    (SP:2902-2903, 3096-3108)"
  holder_left_party: "no reservation and no effect (holder index not found)"
  dispel: "monster Dispel clears ExpireTime, the 0.5 s re-apply restores it: auras are effectively undispellable"
  temple_scroll_pedestal:
    caster: {skill: 7, mastery: 3, level: 40}  # getSpecialBuffSkill, SP:3079-3081
    scroll_or_pedestal: "holder := Map.Name; dropped on entering a different OUTDOOR map (SP:2702-2712, 2748-2753)"
    temple_donation: "cast while a house is open -> holder := 'Temple'; dropped on the next map load
      (SP:2713-2722, 2842-2844)"
  reset_each_apply:
    # SP:2647; Power/Skill are kept for 16, 19, 11, 18, 10
    party_buffs: [6, 0, 17, 4, 12, 1, 8, 10, 14, 15, 9, 13, 2, 16, 19, 18]
    member_buffs: [1, 4, 11, 12, 6, 10]  # SP:2649
  solo_free: "Party.High == 0: Wizard Eye (power 10, skill 2) and Torch (power 3) always on (SP:2968-2975)"
  npc_profession_38: "Wizard Eye always on (SP:2977-2983)"
  vampire_race: "Preservation 5 min refreshed at 21:00-05:00 or indoors, except 7d25 (SP:2957-2967)"
  shadow_boss: "Shadow/Omnipotent boss alive within 2000: Wizard Eye removed (SP:2992-3005)"
  pre_rework_handlers: "the old per-spell code in PlayerCastSpell (DoG, DoP, protection spells, Hour of Power)
    still runs on cast but its Power/expiry is overwritten within 0.5 s (SP:546-653)"

skill_caps:  # SK:169-172
  buff: 50
  day_buff: 75  # Day of the Gods 83, Day of Protection 85, Hour of Power 86

formulas:
  multiplier: "Base[m] / 100 + Scaling[m] * s / 1000   (GetBuffMultiplier, SP:2655-2661)"
  flat: "(Base[m] + level / 4) * (1 + Scaling[m] / 100 * s)   (IT:2953-2956, 3035-3058, 3078-3081)"
  stat_percent: "min(10 + s / 5, 20) percent of the total stat; Light (Day of the Gods): s / 7 (SP:2665-2668)"
  potion_comparison_strength: "Base[m] + Scaling[m] * s / 10 (+ level / 4 for flat buffs) (SP:3192-3202)"

potion_competition:  # SP:3111-3215; potion effects themselves are in potion_effects.yml
  rule: "per buff, the drinker uses the stronger of the party aura (holder s, m, level) and their own potion"
  potion_mastery: 3
  potion_fraction: "f = 0.75 + 0.75 * min(power, 200) / 200"
  potion_skill: "50 * (f - 1)  (70 * (f - 1) for 83 and 85); negative below power 66.7"
  potion_level: "0.5 * power * f"
  hour_of_power: "Haste, Shield, Stone Skin and Fate also compare against Hour of Power at s / 1.5
    (bestBuffSource, SP:3170-3180; Fate ST:113-121)"
  never_stack: "aura and potion never add; per-drinker potions vs party-wide auras"
  potion_checked_for: [3, 14, 25, 36, 58, 69, 5, 17, 38, 46, 51, 83, 85]
  potion_ignored_for: [47, 56, 71, 73]  # getBuffSkill called without the player

