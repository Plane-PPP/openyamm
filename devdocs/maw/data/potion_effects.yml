# draft extracted from MAW ef23ee17
# Potion effects for the MAW ruleset, written in the schema proposed in CLASSES_SPELLS_SPEC.md section 7.8.
# Not loaded by anything. Paths are relative to /home/pjasicek/github/Maw-Mod-MMMerge unless prefixed OpenYAMM/.
# AL = Scripts/General/zzAlchemy.lua, SP = Scripts/General/zzMaw-Spells.lua, IT = Scripts/General/zzMaw-Items.lua,
# ST = Scripts/General/zzMaw-Stats.lua, SK = Scripts/General/zzMAW-Skills.lua, MP = Scripts/Global/zzMAWPotions.lua,
# F = Scripts/Modules/MawCore/Formulas.lua, E = Scripts/Modules/MawCore/Estimates.lua.
#
# ---------------------------------------------------------------------------------------------------------------
# SCHEMA (one file per ruleset; the Standard ruleset uses the same keys, see standard_reference at the end)
#
# rules:                          ruleset-wide drinking rules
#   power_cap                     potion power is clamped to this before any effect (0 = no cap)
#   duration                      default duration of timed effects:
#                                   {per_power_minutes: N}            Standard: N game minutes per point of power
#                                   {hours: H, gm_alchemy_minutes_per_skill: M}   MAW: fixed, plus best party GM bonus
#   combat_recovery               recovery charged when drinking; {value, only_when_enemies_near}
#   recovery_payer                drinker | any_ready_member (MAW lets a ready member pay for a recovering drinker)
#   aura_potion                   MAW only: how a potion acts as a buff caster (curve constants)
#
# potions: <item id>:
#   name, tier                    tier: base | secondary | tertiary | white | black (recipe tree position)
#   use                           drink | item | none   (Potion settings Drinkable / Usable columns)
#   min_power                     refuse (and keep the potion) below this power
#   charges                       uses per bottle; 1 = consumed on first use
#   rechargeable                  true if the Endless Potion (1069) may add charges
#   effects: list of
#     restore:   {pool: hp|sp, amount: EXPR}
#     cure:      [conditions]                      remove now
#     immunity:  [conditions]                      block for the duration
#     buff:      {id: CharacterBuffId, strength: EXPR}   drinker-only timed buff (Standard: 'strength' is the power)
#     aura_buff: {spell: N}                        MAW: drinker-only copy of a buff-aura spell at potion strength;
#                                                  the stronger of potion and party aura applies, never both
#     skill_bonus: {skill, amount: EXPR}           timed
#     party_buff: {id, power: EXPR, mastery}       timed party buff
#     permanent_stat: {stats: [..], amount: EXPR, limit: once_per_character | best_step | none}
#     permanent_resistance: {resistances: [..], amount: EXPR, limit: ...}
#     skill_points: {amount: EXPR, limit: best_step}
#     age: {set_years: N} | {modifier: EXPR} | {clear_magic_age: true}
#     level_modifier: N
#     item_effect: {action: harden | random_standard_enchant | special_enchant | temporary_special_enchant |
#                   recharge_wand, ...}         'use: item' potions; target rules in 'target'
#   source                        file:line of the behaviour
#
# EXPR: a number, or one of
#   {linear: [a, b]}                          a + b*P
#   {pool_share: {pool, flat, share}}         flat + share * estimated pool of a character of level P (MAW E:253-345)
#   {step: {per: S, value: V}}                floor(P/S)*V
#   {step_quadratic: {per: S, a: A, b: B}}    s = floor(P/S); A*s^2 + B*s
#   {sqrt_ceil: {div: D, add: A}}             ceil(sqrt(P)/D) + A
#   {half_floor: true}                        floor(P/2)
# where P is the potion power after rules.power_cap.
# ---------------------------------------------------------------------------------------------------------------

rules:
  power_cap: 500                                   # AL:67-69, AL:298; the drink mutates the item's Bonus to 500
  duration: {hours: 6, gm_alchemy_minutes_per_skill: 6}   # AL:78-85; best party member with Alchemy mastery >= GM,
                                                   # skill as read by GetSkill (clamped to 120 plus hidden extra)
  combat_recovery: {value: 60, only_when_enemies_near: true}   # AL:260-262 (EnemyDetectorRed/Yellow)
  recovery_payer: any_ready_member                 # AL:87-111: drinker if ready, else selected member, else first ready
  refuse_text_without_ready_member: "Player must be active to consume the potion"   # AL:109
  charges_storage: "item.Charges: 0 = fresh (5 uses), n>=2 means n-1 uses left, drinking at 2 removes it"  # AL:248-258
  aura_potion:                                     # SP:3111-3135, 3191-3215
    mastery: 3                                     # POTION_BUFF_MASTERY (Master)
    fraction: {min: 0.75, max: 1.5, full_power: 200}   # f = 0.75 + 0.75*min(P,200)/200
    skill: {span: 50, span_day_buffs: 70}          # s = span*(f-1): -12.5..+25 (DoG/DoP -17.5..+35)
    caster_level_per_power: 0.5                    # level = 0.5*P*f (P not clamped to 200, only to 500)
    compare: "buffStrength = Base + Scaling*s/10 (+ level/4 for flat buffs); stronger of potion and aura wins"
  hotkeys_solo:                                    # SK:1039-1122; not a design to copy (see spec 7.6)
    heal_key: {item: 222, amount: "round(P^1.4)+10", cooldown_s: 15}
    mana_key: {item: 223, amount: "20+2*P", shown: "round(P^1.4*2/3)+10", cooldown_s: 15}

