# ---------------------------------------------------------------------------------------------------------------
# standard_reference: what OpenYAMM implements today (OpenYAMM/game/items/InventoryItemUseRuntime.cpp), written in
# the same schema to show it can be expressed. Duration rule {per_power_minutes: 30} (line 26, 211-231).
# ---------------------------------------------------------------------------------------------------------------
standard_reference:
  rules: {power_cap: 0, duration: {per_power_minutes: 30}, combat_recovery: engine_default, recovery_payer: drinker}
  potions:
    222: {effects: [{restore: {pool: hp, amount: {linear: [10, 1]}}}]}                     # :1227-1233
    223: {effects: [{restore: {pool: sp, amount: {linear: [10, 1]}}}]}                     # :1235-1241
    224: {effects: [{cure: [Weak]}]}                                                       # :1134-1138
    225: {effects: [{cure: [DiseaseWeak, DiseaseMedium, DiseaseSevere]}]}                  # :1139-1145
    226: {effects: [{cure: [PoisonWeak, PoisonMedium, PoisonSevere]}]}                     # :1146-1152
    227: {effects: [{cure: [Asleep]}]}                                                     # :1153-1157
    228: {effects: [{buff: {id: Haste, strength: 5, unless: Weak}}]}                       # :1160-1167
    229: {effects: [{buff: {id: Heroism, strength: 5}}]}                                   # :1168-1172
    230: {effects: [{buff: {id: Bless, strength: 5}}]}                                     # :1173-1177
    231: {effects: [{buff: {id: Preservation, strength: {linear: [0, 3]}}}]}               # :1178-1187
    232: {effects: [{buff: {id: Shield, strength: {linear: [0, 3]}}}]}                     # :1188-1192
    233: {use: item, effects: [{item_effect: {action: recharge_wand, formula: "max*(100-max(0,70-P))%"}}]}
                                                    # InventoryItemMixingRuntime.cpp:19, 261-270, 296-321
    234: {effects: [{buff: {id: Stoneskin, strength: 5}}]}                                 # :1193-1197
    235: {effects: [{buff: {id: WaterBreathing, strength: 5}}]}                            # :1198-1202
    236: {use: item, effects: [{item_effect: {action: harden}}]}       # InventoryItemMixingRuntime.cpp:20, 141-155
    237: {effects: [{cure: [Fear]}]}                                                       # :1203-1207
    238: {effects: [{cure: [Cursed]}]}                                                     # :1208-1212
    239: {effects: [{cure: [Insane]}]}                                                     # :1213-1217
    240-245: {effects: [{buff: {id: "TempMight/Intellect/Personality/Endurance/Speed/Accuracy",
                                strength: {linear: [0, 3]}}}]}                             # :234-264, 1124-1130
    246-250: {use: item, effects: [{item_effect: {action: temporary_special_enchant,
              enchant: "Flame/Frost/Poison/Sparks/Swift", minutes_per_power: 30}}]}
                                                    # InventoryItemMixingRuntime.cpp:21-25, 87-105, 157-187
    251: {effects: [{cure: [Paralyzed]}]}                                                  # :1218-1222
    252: {effects: [{cure: "all but Dead/Petrified/Eradicated; also Paralyzed, Zombie"}]}  # :139-166, 1243-1249
    253: {effects: [{restore: {pool: hp, amount: {linear: [0, 5]}}}]}                      # :1251-1257
    254: {effects: [{restore: {pool: sp, amount: {linear: [0, 5]}}}]}                      # :1259-1265
    255: {effects: [{buff: {id: TempLuck, strength: {linear: [0, 3]}}}]}                   # :250-251
    256-261: {effects: [{buff: {id: "Fire/Air/Water/Earth/Mind/Body resistance", strength: {linear: [0, 3]}}}]}
                                                                                           # :252-263
    262: {effects: [{cure: [Petrified]}]}                                                  # :1267-1273
    263: {use: item, effects: [{item_effect: {action: special_enchant, enchant: DragonSlaying, permanent: true}}]}
                                                    # InventoryItemMixingRuntime.cpp:26, 157-187 (timer set too)
    264-270: {effects: [{permanent_stat: {stats: ["Luck/Speed/Intellect/Endurance/Personality/Accuracy/Might"],
