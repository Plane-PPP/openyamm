endless_potion:                                    # item 1069, used on a potion in the inventory
  applies_to: [231, 232, 233, 237, 245, 251, 257, 263]          # AL:1011
  add_charges: "item.Charges = (Charges == 0 ? 6 : Charges) + BonusStrength"   # AL:1083-1088
  bonus_strength_on_drop: "min(bestAlchemySkill + 10, 100)"     # AL:690-697

# Worked values (Lua port, scratch potions.lua; difficulty 3 = bolster 100). Spec section 7.4 has the table.
examples_power: {P: [10, 50, 100, 200], cure_wounds_hp: [46, 185, 494, 1919], magic_potion_sp: [34, 181, 553, 1928],
