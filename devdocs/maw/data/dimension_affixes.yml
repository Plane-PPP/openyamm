# draft extracted from MAW ef23ee17
# Dimension-map affixes ("mapping", item 290). Paths relative to Maw-Mod-MMMerge/Scripts/.
# value = base + Power x scale (calculateAffixPower, General/zzMaw-Maps.lua:1084-1112).
#   kind reduction: shown and applied as 100 x (1 - 1/(1 + value/100)) with 2 decimals (Formulas.reductionPercent)
#   kind proc:      capped at 100
# Paths: Damage.lua = Modules/MawCore/Damage.lua, Global/... as written, other bare names = General/.
# Power is the map item's MaxCharges. Effects read getMapAffixPower(n) at the listed sites; "X" is the final value.
# examples: X at Power 10 / 30 / 60.
format: 1
source: {repo: Maw-Mod-MMMerge, commit: ef23ee17}

map_item:
  item_id: 290                   # renamed "Dimension Map" (zzMaw-Maps.lua:1037)
  fields: {BonusStrength: target mapstats id, BonusExpireTime: affix 1, Bonus2: affix 2, "Charges % 1000": affix 3,
           "floor(Charges / 1000)": affix 4, Bonus: affix count (0 means 4), MaxCharges: Power}
  unlock: "vars.dimensionalMapsQuest.Done (oracle topic)"
  target_pool: "completed dungeons among mapDungeons (143 mapstats ids incl. outdoor maps 1-14, zzMaw-Maps.lua:791)"
  drop:                          # MonsterKilled, zzMaw-Maps.lua:826-939
    base_chance: 0.001
    chance: "pity(0.001 x completed/143, failures) x mon.Level/100 / (mapsDropped on this map + 1) x mult"
    mult: {boss: 10, broodling: "10 / (5 - tier)"}
    level_required: {default: 100, madness: 70}      # getMonsterLevel(mon)
    madness_map_level_required: 950  # map mean + 20 + Power x 10 must reach MADNESS_MAP_DROP_LEVEL, else no drop
    seeded_roll: "mapvars.MonsterSeed[index] + 1337 when vars.seed is set"
    failures: "vars.mapDropFailures += mult on a failed eligible roll; 0 on a drop"
    affix_count: {4: 0.10, 3: 0.20, 2: 0.70, 1: 0.0}   # bug: `elseif bonus<=0.6` tests bonus, not roll
    affixes: "distinct, uniform 1..33"
    power: "round(monsterLevel/10 - U{0,1,2,3}); Road to Insanity (not Madness): at least 30"
  on_completion:                 # checkMapCompletition, zzMaw-Monsters.lua:2646-2756
    map_already_completed_branch: >-
      (every dimension map, since targets are completed dungeons; not in Madness) no exp/gold;
      grants a new map: target random completed dungeon, affix 2 always, 3 at 60%, 4 at 50%, 1 at 40%,
      Bonus 0 (read as 4 slots, empty ones are 0), Power = min(round(Power + 1), 255)
    madness_branch: "normal completion reward with madness formula, plus item by affix count {1: 1070, 2: 1061,
      3: 1062, 4: 1065} instead of the crafting cube and gems"
  entering:                      # UseMouseItem, zzMaw-Maps.lua:959-1027
    refill: "target map RefillDays = 0 for this visit (restored on AfterLoadMap)"
    monsters: "3 random families from possibleMonstersIn (.blv) / possibleMonstersOut (.odm) (seeded from the item)"
    density: "Mon{1..3}Hi x (1 + (Power x nAff + 20 x nAff) / 300), rounded"
    monster_level: "base level + map extraBolster + Power x 10 + 20 (no party bolster, no horizontal x2.5)"
    shown_level: "Power x 10 + 20 + round(mean of the map band)"   # getDimensionMapLevel, zzMaw-Maps.lua:804-807
    loot: "rarity mult x (1 + (Power x nAff + 20 x nAff)/400); enchant tier bonus floor(max((Power - 28)/2, 0))"
    crafting_drop: "x (1 + (Power x nAff + 20 x nAff)/800 x 1.5)"   # zzAlchemy.lua:1167-1175

