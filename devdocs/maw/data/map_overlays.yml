    survival_mode_target: {map: 7out01.odm, pos: [12567, 1728, 1], dir: 512}   # oute3 copy only
    if_qbit: 527                     # Able to use boat to get off Emerald Island
    then: {map: 7out02.odm, pos: [-16832, 12512, 372], dir: 0, icon: 3}
    else: {map: 7out01.odm, pos: [12552, 800, 193], dir: 512, icon: 3}
  1888:
    hint: Jadame
