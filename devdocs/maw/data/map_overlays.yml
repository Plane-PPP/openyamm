# draft extracted from MAW ef23ee17
# Per-map overlay operations needed to express MAW's map and content changes on top of OpenYAMM's base maps
# and generated events. Companion of devdocs/maw/MAPS_CONTENT.md (sections in brackets).
# Sources: Maw-Mod-MMMerge Data/zMaw.games.lod (maps), Scripts/Maps, Scripts/Global, Scripts/General.
# Conventions:
#   - Coordinates are world units. Terrain cells: x = (cx-64)*512, y = (64-cy)*512; height value * 32 = z.
#     Cell strings are "cx,cy:base>maw".
#   - bmodel and face indices are base MMMerge indices; OpenYAMM appends its own bmodels after them, so they
#     are valid in assets_dev/worlds/*/maps/*.odm.
#   - map_var: MMExt MapVarN == OpenYAMM MapVar(N+2). Names below use the OpenYAMM index.
#   - op kinds: replace (ReplaceMapEvent), register (RegisterEvent/RegisterMapTimerEvent), on_load
#     (RegisterMapOnLoadEvent), keep_base (MAW drops it; do NOT port the drop).
#   - "needs:" lists engine features that do not exist yet (MAPS_CONTENT.md 2.5 and 3.0).
#   - Monster ids are Monsters.txt ids; tiers are [A%, B%, C%] weights (MAW pseudoSpawnpoint).
format: 1
source: {repo: Maw-Mod-MMMerge, commit: ef23ee17}

# As built (2026-10-24): the overlays below are in assets_dev/rulesets/maw/ (map names are unique across worlds).
overlay_files:
  map_events: "rulesets/maw/events/maps/<map>_maw.lua"
  global_events: "rulesets/maw/events/Global_maw.lua"
  scene: "rulesets/maw/maps/<map>_zz_maw.scene.yml"  # sorts after <map>.scene.N.yml, <map>_1.scene.yml
  gate: "mounted only for games started with the MAW ruleset"

