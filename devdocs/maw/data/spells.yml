# draft extracted from MAW ef23ee17
# Spell data for an OpenYAMM "MAW" ruleset. Generated from MAW Data/Tables/Spells2.txt, base
# reference/mmmerge/Data/Tables/Spells2.txt, OpenYAMM assets_dev/engine/data_tables/spells.txt and the
# BackendSpellRule switch in game/party/PartySpellSystem.cpp, plus the Lua overrides in
# Scripts/General/zzMaw-Spells.lua (SP:line). Spec: ../CLASSES_SPELLS_SPEC.md section 1.
#
# Fields
#   cost / delay: [Normal, Expert, Master, GM]; cost in SP before Ascension and the personality factor,
#                 delay in recovery ticks before Speed, Haste, Ascension and armour (spec section 1.2).
#   damage: {add, dice_min, dice_max}: add + sum over skill points of rand(dice_min..dice_max);
#           dice_min == dice_max means a fixed amount per point (SP:1976-1986).
#   base: reference/mmmerge Spells2.txt.  openyamm: spells.txt row plus the explicit BackendSpellRule
#   values that override it (rule_*; empty = rule falls back to the table).  maw: MAW values.
#   ascension: damage | heal | cc | none.  kind: damage | heal | aura | utility_aura | cc | other.
#   change: which OpenYAMM fields a MAW ruleset has to change.
# Class-specific spell variants (Death Knight, Assassin, Elementalist, Dragon) are under class_variants.

ascension_scope:
  damage_spells: [2, 6, 7, 8, 9, 10, 11, 15, 18, 20, 22, 24, 26, 29, 32, 37, 39, 41, 43, 44, 52, 59, 65, 70, 76, 78,
    79, 84, 87, 90, 93, 97, 98, 99, 103, 111, 123]  # SP:1888
  healing_spells: [49, 54, 55, 68, 74, 77]  # SP:2108, 2169
  cc_spells: [34, 35, 48, 60, 62, 63, 66, 81, 92, 94, 96, 113, 122]  # CCMAP keys, SP:1337-1350
  # weapon enchant damage / 2.5 on these, SP:2094
  aoe_enchant_divisor_spells: [6, 7, 8, 9, 10, 15, 22, 24, 32, 41, 43, 84, 93, 97, 98, 99, 123]

