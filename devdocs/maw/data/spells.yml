# Class-specific spell variants (Death Knight, Assassin, Elementalist, Dragon, Seraphim); see spec section 5.
class_variants:
  # MCC = Scripts/Modules/MawCore/Classes.lua, DM = Scripts/Modules/MawCore/Damage.lua, CL = Scripts/General/zzClasses.lua,
  # SP = Scripts/General/zzMaw-Spells.lua, ST = Scripts/General/zzMaw-Stats.lua.
  # Common Death Knight rules (MCC:17-36, 108-122, 458-486, 843-886; DM:695-818):
  #   - known by school mastery (N/E/M/G = 1st..4th entry), spell books disabled; costs are fixed (no Ascension,
  #     no Personality); delay = current melee attack delay; buffs reserve no mana (SP:3055-3058).
  #   - weapon-damage spells (DKDamageMult): damage = melee roll (min..max) * mightLevelSwap, crit roll, + weapon
  #     fire-aura and elemental enchant damage, / spell element resistance, * melee damage multiplier, * 0.5 if Weak,
  #     * mult[mastery of the governing school]. No Int/crit spell pipeline (SP:2005).
  # Common Assassin rules (MCC:63-101, 239-292, 595-640; DM:820-870):
  #   - known by school mastery: Combat m+1, Subtlety m+2, Poisons m+1, Assassination m+1 entries of each list.
  #   - cost = energy (SP) "Cost" plus combo points "StackCost"; with too few combo points the cost shows 1000 and
  #     the cast is cancelled. Delay = 2 x attack delay (MCC:448-450).
  #   - damage spells: melee roll * mightLevelSwap - Assassination crowd cut (halved for spells), crit, + weapon
  #     enchant damage, / spell element resistance, * melee damage multiplier, * 0.5 if Weak, * DamageMult.
  #   - no Ascension (SP:2554-2557); normal MAW spell hooks are skipped for assassins (SP:132-135).

