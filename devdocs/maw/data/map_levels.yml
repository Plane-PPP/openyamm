# Display names in the MAW table that OpenYAMM's map_stats.txt cannot resolve:
#   "The Breach" -> Breach.odm (204), BrAlvar.odm (205); "Basement of the Breach" -> BrBase.blv (206):
#     these three maps do not exist in OpenYAMM (map_stats.txt has no rows 204-206).
#   "The Abandoned Temple" -> 6d02.blv (153): MAW renames row 153 in its mapstats.txt; OpenYAMM still names
#     both d05.blv and 6d02.blv "Abandoned Temple", so a lookup by display name would give 6d02 the d05 band.

# Horizontal progression starter maps: monsters stay near their vanilla level (zzMaw-Monsters.lua:946-955).
horizontal_starter_maps:
  - d05.blv  # Abandoned Temple
  - 7d29.blv  # Castle Harmondale
  - out01.odm  # Dagger Wound Island
  - 7out01.odm  # Emerald Island
  - 6d01.blv  # Goblinwatch
  - oute3.odm  # New Sorpigal
  - 6d02.blv  # The Abandoned Temple
  - 7d28.blv  # The Dragon's Lair
  - 7d06.blv  # The Temple of the Moon

madness:
  # Beyond Madness fixes every listed map at a level along its game's campaign (zzMaw-Monsters.lua:1784-1811).
  top_level: 500        # MADNESS_TOP_LEVEL
  curve: 1.2            # MADNESS_CURVE
  level_formula: "round(top_level * (position / campaign_length) ^ curve)"   # round() = half up
  campaign_length: {mm6: 54, mm7: 52, mm8: 58}
  # Maps where the fixed madness level is NOT applied: monsters follow the horizontal starter-map rule
  # and unique monsters get 3x their base level (zzMaw-Monsters.lua:289-303, 431-433).
  starting_maps:
    - out01.odm  # Dagger Wound Island
    - 7out01.odm  # Emerald Island
    - oute3.odm  # New Sorpigal
    - 7d28.blv  # The Dragon's Lair
    - 7d06.blv  # The Temple of the Moon
  # Explicit overrides assigned after the formula (lines 1806-1811).
  fixed_levels:
    BrBase.blv: 1100   # Basement of the Breach
    Breach.odm: 1100   # The Breach
    BrAlvar.odm: 1100   # The Breach
    7d05.blv: 1   # The Arena
    zarena.blv: 1   # The Arena
    d50.blv: 1   # NWC
    # "Pending" (capital P) = 1 is also set; no map has that name (the placeholder maps are "pending").
