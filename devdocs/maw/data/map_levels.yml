#   mm6/mm7/mm8MapProgression 1594-1785, madnessLevel 1787-1792, madnessMapLevels 1794-1811.
# MAW keys these tables by map DISPLAY name (Game.MapStats[i].Name, from MAW's own mapstats.txt in
# Data/zMaw.T.lod). This draft re-keys them by map FILE name. Where several maps share a display name they
# share one MAW entry; such maps are listed individually here with `shared_key`. Values are the EFFECTIVE
# ones (a Lua table constructor keeps the last duplicate key); `maw_intended` records an overwritten entry.
# low/mid/high: the B-tier level the 1st/2nd/3rd native monster family (sorted by base B level) is pinned to.
# See devdocs/maw/BALANCE_MODEL.md section 7 for how these feed monster levels in each progression mode.
