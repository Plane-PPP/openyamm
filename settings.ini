; OpenYAMM settings: only the values you changed. Everything else follows the game's defaults.
; Volumes use the original-style 0..9 scale.

[profile]
name=desktop
version=5

[audio]
music_volume=4
voice_volume=4

[gameplay]
quest_markers=true
context_action_popup=false
compact_bags=false

[logging]
fps_trace=true

[video]
warm_torch_light=true
shadows=true
model_shadow_quality=2
ambient_occlusion=true
ambient_occlusion_strength=100
bloom=true
antialiasing=4x
water_sprite_reflections=true
terrain_anisotropy=8x
skip_event_cutscenes=true
window_mode=windowed
resolution=1600x900
vsync=false

[debug]
minotaur_damage_trace=false
axe_damage_trace=false
lethal_strike_trace=false
minotaur_russian_text=false
preseed_party=false
party_seed_roster_id=0
start_world=mm8
start_map_file=oute3.odm
turbo_movement=true
immortal=true
new_game_god_lich=false
console=true
