name: Minotaur Windows build

on:
  push:
    branches:
      - feature/minotaur-rebalance
    paths:
      - ".github/workflows/minotaur-windows.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "engine/**"
      - "game/**"
      - "packaging/**"
      - "tools/**"
      - "assets_dev/**"
      - "settings_release.ini"
      - "README.md"
      - "CHANGELOG.md"
      - "BUILD-NOTES.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      previous_build_sha:
        description: "Commit SHA of the previous confirmed Windows package (optional)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: minotaur-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 release
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Preserve repository line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - name: Check out feature sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /CHANGELOG.md
            /BUILD-NOTES.md
            /docs/
            /CMakeLists.txt
            /LICENSE
            /COPYRIGHT
            /settings_release.ini
            /cmake/
            /engine/
            /game/
            /packaging/
            /tools/openyamm_shaderc_stubs.cpp
            /tools/cook_sprite_atlases_main.cpp
            /tools/SpriteAtlasEncode.cpp
            /tools/SpriteAtlasEncode.h
            /tools/cook_sprite_atlases.py
            /tools/package_runtime_assets.py
            /assets_dev/_legacy/sprites_original/
            /assets_dev/engine/
            /assets_dev/worlds/mm6/
            /assets_dev/worlds/mm7/
            /assets_dev/worlds/mm8/
            /assets_dev/worlds/mmmerge/

      - name: Install MSYS2 UCRT64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python

      - name: Configure release build
        run: >-
          cmake -S . -B build-windows -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DOPENYAMM_BUILD_DESKTOP_EXECUTABLE=ON
          -DOPENYAMM_BUILD_TESTS=OFF
          -DOPENYAMM_BUILD_EDITOR=OFF
          -DOPENYAMM_BUILD_TOOLS=OFF

      - name: Record package revision and changes
        env:
          PREVIOUS_BUILD_SHA: ${{ inputs.previous_build_sha }}
        run: |
          revision_file="BUILD-REVISION.txt"
          printf 'Commit SHA: %s\nRepository: %s\nRef: %s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_REF" > "$revision_file"
          if [ -n "$PREVIOUS_BUILD_SHA" ]; then
            [[ "$PREVIOUS_BUILD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "Invalid previous build SHA"; exit 1; }
            git fetch --no-tags --depth=1 origin "$PREVIOUS_BUILD_SHA"
            printf '\nPrevious confirmed package SHA: %s\nChanged files:\n' "$PREVIOUS_BUILD_SHA" >> "$revision_file"
            git diff --name-status "$PREVIOUS_BUILD_SHA" "$GITHUB_SHA" >> "$revision_file"
          else
            printf '\nPrevious package SHA was not supplied; comparison is pending.\nSee BUILD-NOTES.md and CHANGELOG.md for the planned changes.\n' >> "$revision_file"
          fi

      - name: Build Windows package
        run: >-
          cmake --build build-windows
          --target openyamm_windows_release_zip
          --parallel 4

      - name: Verify Windows package
        run: |
          archive="build-windows/release/OpenYAMM-windows-Release.zip"
          test -s "$archive"
          cmake -E tar tf "$archive" > windows-package-contents.txt
          grep -Fxq "OpenYAMM/openyamm.exe" windows-package-contents.txt
          grep -Fxq "OpenYAMM/settings.ini" windows-package-contents.txt
          grep -Fxq "OpenYAMM/README.md" windows-package-contents.txt
          grep -Fxq "OpenYAMM/CHANGELOG.md" windows-package-contents.txt
          grep -Fxq "OpenYAMM/BUILD-NOTES.md" windows-package-contents.txt
          grep -Fxq "OpenYAMM/BUILD-REVISION.txt" windows-package-contents.txt
          grep -Fxq "OpenYAMM/docs/MINOTAUR_REBALANCE.md" windows-package-contents.txt
          grep -Fxq "OpenYAMM/docs/ROADMAP.md" windows-package-contents.txt
          grep -Fxq "OpenYAMM/runtime/shaders/glsl/vs_outdoor_billboard_lit.bin" windows-package-contents.txt
          grep -Fxq "OpenYAMM/runtime/shaders/glsl/fs_sprite_atlas.bin" windows-package-contents.txt
          grep -Fxq "OpenYAMM/assets/engine.zip" windows-package-contents.txt
          grep -Fxq "OpenYAMM/assets/worlds/mm6.zip" windows-package-contents.txt
          grep -Fxq "OpenYAMM/assets/worlds/mm7.zip" windows-package-contents.txt
          grep -Fxq "OpenYAMM/assets/worlds/mm8.zip" windows-package-contents.txt
          grep -Fxq "OpenYAMM/assets/worlds/mmmerge.zip" windows-package-contents.txt

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: openyamm-minotaur-${{ github.sha }}-windows-x64
          path: build-windows/release/OpenYAMM-windows-Release.zip
          archive: false
          if-no-files-found: error
          retention-days: 7
