name: Minotaur Windows build

on:
  push:
    branches:
      - feature/minotaur-rebalance
    paths:
      - ".github/workflows/minotaur-windows.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "engine/**"
      - "game/**"
      - "packaging/**"
      - "tools/**"
      - "assets_dev/**"
      - "settings_release.ini"
      - "README.md"
      - "CHANGELOG.md"
      - "BUILD-NOTES.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      tests_only:
        description: "Run Windows installer tests without rebuilding the game"
        type: boolean
        default: false
      package_mode:
        description: "Incremental ZIP for an existing mod install, full install, or both"
        type: choice
        options: [update, full, both]
        default: update
      baseline_version:
        description: "Optional base version; empty uses packaging/minotaur/latest-baseline.json"
        type: string
        required: false
      previous_build_sha:
        description: "Commit SHA of the previous confirmed Windows package (optional)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: minotaur-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update_tests:
    name: Offline updater tests (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/
            /packaging/minotaur/
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Test generation, safety and the actual Windows installer
        run: python tools/test_minotaur_updates.py
      - name: Test full and thin package validation
        run: python tools/test_verify_minotaur_windows_package.py

  windows:
    needs: update_tests
    if: ${{ inputs.tests_only != true }}
    name: Windows x64 release
    env:
      MINOTAUR_PACKAGE_MODE: ${{ inputs.package_mode || 'update' }}
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Preserve repository line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - name: Check out feature sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /CHANGELOG.md
            /BUILD-NOTES.md
            /docs/
            /CMakeLists.txt
            /LICENSE
            /COPYRIGHT
            /cmake/
            /engine/
            /game/
            /packaging/
            /tools/
            /tests/
            /third_party/doctest/
            /assets_dev/_legacy/sprites_original/
            /assets_dev/engine/
            /assets_dev/worlds/mm6/
            /assets_dev/worlds/mm7/
            /assets_dev/worlds/mm8/

      - name: Install MSYS2 UCRT64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-yaml

      - name: Check packaging Python
        run: /ucrt64/bin/python.exe -c "import sys, yaml; print(sys.executable); print(yaml.__version__)"

      - name: Select update base and unique app version
        env:
          REQUESTED_BASE: ${{ inputs.baseline_version }}
          PREVIOUS_BUILD_SHA: ${{ inputs.previous_build_sha }}
        run: |
          base_version="$REQUESTED_BASE"
          if [ -z "$base_version" ]; then
            base_version=$(/ucrt64/bin/python.exe -c "import json; print(json.load(open('packaging/minotaur/latest-baseline.json'))['version'])")
          fi
          [[ "$base_version" =~ ^minotaur-[A-Za-z0-9][A-Za-z0-9.-]*$ ]] || exit 1
          base_path="packaging/minotaur/bases/$base_version.json"
          read -r checked_version base_sha <<< "$(/ucrt64/bin/python.exe tools/minotaur_updates.py check-base "$base_path")"
          test "$checked_version" = "$base_version"
          if [ -n "$PREVIOUS_BUILD_SHA" ] && [ "$PREVIOUS_BUILD_SHA" != "$base_sha" ]; then
            echo "previous_build_sha must match the selected baseline"; exit 1
          fi
          printf 'MINOTAUR_BASE_PATH=%s\nMINOTAUR_BASE_SHA=%s\nMINOTAUR_RELEASE_VERSION=minotaur-1.14-%s-%s-%s\n' \
            "$base_path" "$base_sha" "${GITHUB_SHA:0:12}" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Configure release build
        run: >-
          cmake -S . -B build-windows -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DPython3_EXECUTABLE="$(cygpath -m /ucrt64/bin/python.exe)"
          -DOPENYAMM_BUILD_DESKTOP_EXECUTABLE=ON
          -DOPENYAMM_BUILD_TESTS=ON
          -DOPENYAMM_COOK_ON_BUILD=OFF
          -DOPENYAMM_RELEASE_VERSION=${MINOTAUR_RELEASE_VERSION}
          -DOPENYAMM_RELEASE_THIN=ON
          -DOPENYAMM_RELEASE_CONTENT_DIR="$(cygpath -m "$PWD/build-windows/minotaur-content")"
          -DOPENYAMM_BUILD_EDITOR=OFF
          -DOPENYAMM_BUILD_TOOLS=OFF

      - name: Record package revision and changes
        run: |
          PREVIOUS_BUILD_SHA="$MINOTAUR_BASE_SHA"
          revision_file="BUILD-REVISION.txt"
          printf 'Commit SHA: %s\nRepository: %s\nRef: %s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_REF" > "$revision_file"
          if [ -n "$PREVIOUS_BUILD_SHA" ]; then
            [[ "$PREVIOUS_BUILD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "Invalid previous build SHA"; exit 1; }
            git fetch --no-tags --depth=1 origin "$PREVIOUS_BUILD_SHA"
            printf '\nPrevious confirmed package SHA: %s\nChanged files:\n' "$PREVIOUS_BUILD_SHA" >> "$revision_file"
            git diff --no-renames --name-status "$PREVIOUS_BUILD_SHA" "$GITHUB_SHA" >> "$revision_file"
          else
            printf '\nPrevious package SHA was not supplied; comparison is pending.\nSee BUILD-NOTES.md and CHANGELOG.md for the planned changes.\n' >> "$revision_file"
          fi

          printf '\n## Фактическая ревизия Actions-пакета\n\n```text\n' >> BUILD-NOTES.md
          cat "$revision_file" >> BUILD-NOTES.md
          printf '\n```\n' >> BUILD-NOTES.md

      - name: Build Windows program, shaders and cooker
        run: >-
          cmake --build build-windows
          --target openyamm openyamm_launcher openyamm_runtime_shaders openyamm_sprite_atlas_cook
          --parallel 4

      - name: Build and test Minotaur combat and save compatibility
        run: |
          cmake --build build-windows --target openyamm_unit_tests --parallel 4
          # MM9 is not shipped by this MM6/MM7/MM8 package; Bloodaxe is not an Axe mechanic test.
          build-windows/tests/openyamm_unit_tests.exe --test-case='*Lethal Strike*,*Minotaur*,*Axe*' --test-case-exclude='MM9*'

      - name: Prepare indexed content (not included in unchanged update payloads)
        run: >-
          /ucrt64/bin/python.exe tools/package_runtime_assets.py
          --assets-root assets_dev --output build-windows/minotaur-content
          --profile desktop --cooker build-windows/game/openyamm_sprite_atlas_cook.exe
          --release "${MINOTAUR_RELEASE_VERSION}" --build "${GITHUB_SHA}"

      - name: Package and verify the small program archive
        run: |
          cmake --build build-windows --target openyamm_release_package --parallel 4
          /ucrt64/bin/python.exe tools/verify_minotaur_windows_package.py \
            build-windows/release/OpenYAMM-windows-x64-Release.zip \
            --stage build-windows/release/Release/OpenYAMM \
            --thin --content-dir build-windows/minotaur-content

      - name: Create incremental ZIP and next baseline
        run: >-
          /ucrt64/bin/python.exe tools/minotaur_updates.py build
          --stage build-windows/release/Release/OpenYAMM
          --content build-windows/minotaur-content
          --base "${MINOTAUR_BASE_PATH}" --source-sha "${GITHUB_SHA}"
          --output "build-windows/minotaur-update/Minotaur-Update-${MINOTAUR_RELEASE_VERSION}.zip"
          --baseline-output build-windows/minotaur-update/minotaur-baseline.json

      - name: Upload incremental ZIP
        if: env.MINOTAUR_PACKAGE_MODE != 'full'
        uses: actions/upload-artifact@v7
        with:
          name: minotaur-update-${{ github.sha }}-windows-x64
          path: build-windows/minotaur-update/*.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload baseline and size/checksum report
        uses: actions/upload-artifact@v7
        with:
          name: minotaur-update-metadata-${{ github.sha }}
          path: build-windows/minotaur-update/*.json
          if-no-files-found: error
          retention-days: 90

      - name: Create optional full installation
        if: env.MINOTAUR_PACKAGE_MODE != 'update'
        run: |
          cmake -S . -B build-windows -DOPENYAMM_RELEASE_THIN=OFF
          cmake --build build-windows --target openyamm_release_package --parallel 4
          /ucrt64/bin/python.exe tools/verify_minotaur_windows_package.py \
            build-windows/release/OpenYAMM-windows-x64-Release.zip \
            --stage build-windows/release/Release/OpenYAMM

      - name: Upload optional full installation
        if: env.MINOTAUR_PACKAGE_MODE != 'update'
        uses: actions/upload-artifact@v7
        with:
          name: openyamm-minotaur-${{ github.sha }}-windows-x64
          path: build-windows/release/OpenYAMM-windows-x64-Release.zip
          archive: false
          if-no-files-found: error
          retention-days: 7
