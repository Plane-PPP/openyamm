name: Minotaur Windows build

on:
  push:
    branches:
      - feature/minotaur-rebalance
    paths:
      - ".github/workflows/minotaur-windows.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "engine/**"
      - "game/**"
      - "packaging/**"
      - "tools/**"
      - "assets_dev/**"
      - "settings_release.ini"
      - "README.md"
      - "CHANGELOG.md"
      - "BUILD-NOTES.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      tests_only:
        description: "Run Windows installer tests without rebuilding the game"
        type: boolean
        default: false
      package_mode:
        description: "Incremental ZIP for an existing mod install, full install, or both"
        type: choice
        options: [update, full, both]
        default: update
      baseline_version:
        description: "Optional base version; empty uses packaging/minotaur/latest-baseline.json"
        type: string
        required: false
      previous_build_sha:
        description: "Commit SHA of the previous confirmed Windows package (optional)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: minotaur-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update_tests:
    name: Offline updater tests (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/
            /packaging/minotaur/
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Test generation, safety and the actual Windows installer
        run: python tools/test_minotaur_updates.py
      - name: Test full and thin package validation
        run: python tools/test_verify_minotaur_windows_package.py
      - name: Test Windows resource monitoring
        run: |
          python tools/test_measure_windows_build.py
          python tools/measure_windows_build.py --phase smoke -- python -c "print('Native Windows monitoring smoke test')"

  windows:
    needs: update_tests
    if: ${{ inputs.tests_only != true }}
    name: Windows x64 release
    env:
      MINOTAUR_UPSTREAM_VERSION: "2.3"
      MINOTAUR_UPSTREAM_SHA: f4a6b8032759a218505532b2600ac56b6d80c7af
      MINOTAUR_PACKAGE_MODE: ${{ inputs.package_mode || 'update' }}
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Preserve repository line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - name: Check out feature sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /CHANGELOG.md
            /BUILD-NOTES.md
            /docs/
            /CMakeLists.txt
            /LICENSE
            /COPYRIGHT
            /cmake/
            /engine/
            /game/
            /packaging/
            /tools/
            /tests/
            /third_party/doctest/
            /assets_dev/_legacy/sprites_original/
            /assets_dev/engine/
            /assets_dev/worlds/mm6/
            /assets_dev/worlds/mm7/
            /assets_dev/worlds/mm8/

      - name: Select the pinned Medusa content
        shell: pwsh
        run: |
          $config = Get-Content packaging/medusa/content.json -Raw | ConvertFrom-Json
          if ($config.commit -notmatch '^[0-9a-f]{40}$') { throw "Medusa content must be pinned" }
          "MEDUSA_CONTENT_SHA=$($config.commit)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out the pinned Medusa package
        uses: actions/checkout@v7
        with:
          repository: Plane-PPP/project-medusa
          ref: ${{ env.MEDUSA_CONTENT_SHA }}
          path: medusa-content
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /content/engine/rulesets/medusa/

      - name: Install MSYS2 UCRT64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-yaml

      - name: Check packaging Python
        run: /ucrt64/bin/python.exe -c "import sys, yaml; print(sys.executable); print(yaml.__version__)"

      - name: Install the pinned Medusa ruleset into the combined build
        run: |
          test "$(git -C medusa-content rev-parse HEAD)" = "$MEDUSA_CONTENT_SHA"
          /ucrt64/bin/python.exe packaging/medusa/install_content.py --source medusa-content --assets assets_dev

      - name: Select update base and unique app version
        env:
          REQUESTED_BASE: ${{ inputs.baseline_version }}
          PREVIOUS_BUILD_SHA: ${{ inputs.previous_build_sha }}
        run: |
          base_version="$REQUESTED_BASE"
          if [ -z "$base_version" ]; then
            base_version=$(/ucrt64/bin/python.exe -c "import json; print(json.load(open('packaging/minotaur/latest-baseline.json'))['version'])")
          fi
          [[ "$base_version" =~ ^minotaur-[A-Za-z0-9][A-Za-z0-9.-]*$ ]] || exit 1
          base_path="packaging/minotaur/bases/$base_version.json"
          read -r checked_version base_sha <<< "$(/ucrt64/bin/python.exe tools/minotaur_updates.py check-base "$base_path")"
          test "$checked_version" = "$base_version"
          if [ -n "$PREVIOUS_BUILD_SHA" ] && [ "$PREVIOUS_BUILD_SHA" != "$base_sha" ]; then
            echo "previous_build_sha must match the selected baseline"; exit 1
          fi
          printf 'MINOTAUR_BASE_PATH=%s\nMINOTAUR_BASE_SHA=%s\nMINOTAUR_RELEASE_VERSION=minotaur-2.3-%s-%s-%s\n' \
            "$base_path" "$base_sha" "${GITHUB_SHA:0:12}" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Detect actual runner resources and compilation parallelism
        run: /ucrt64/bin/python.exe tools/measure_windows_build.py --probe

      - name: Configure release build
        run: >-
          cmake -S . -B build-windows -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DPython3_EXECUTABLE="$(cygpath -m /ucrt64/bin/python.exe)"
          -DOPENYAMM_BUILD_DESKTOP_EXECUTABLE=ON
          -DOPENYAMM_BUILD_TESTS=ON
          -DOPENYAMM_COOK_ON_BUILD=OFF
          -DOPENYAMM_RELEASE_VERSION=${MINOTAUR_RELEASE_VERSION}
          -DOPENYAMM_RELEASE_THIN=ON
          -DOPENYAMM_RELEASE_CONTENT_DIR="$(cygpath -m "$PWD/build-windows/minotaur-content")"
          -DOPENYAMM_BUILD_EDITOR=OFF
          -DOPENYAMM_BUILD_TOOLS=OFF

      - name: Record package revision and changes
        run: |
          PREVIOUS_BUILD_SHA="$MINOTAUR_BASE_SHA"
          revision_file="BUILD-REVISION.txt"
          printf 'Commit SHA: %s\nRepository: %s\nRef: %s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_REF" > "$revision_file"
          printf 'Upstream release: v%s\nUpstream SHA: %s\n' "$MINOTAUR_UPSTREAM_VERSION" "$MINOTAUR_UPSTREAM_SHA" >> "$revision_file"
          if [ -n "$PREVIOUS_BUILD_SHA" ]; then
            [[ "$PREVIOUS_BUILD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "Invalid previous build SHA"; exit 1; }
            git fetch --no-tags --depth=1 origin "$PREVIOUS_BUILD_SHA"
            printf '\nPrevious confirmed package SHA: %s\nChanged files:\n' "$PREVIOUS_BUILD_SHA" >> "$revision_file"
            git diff --no-renames --name-status "$PREVIOUS_BUILD_SHA" "$GITHUB_SHA" >> "$revision_file"
          else
            printf '\nPrevious package SHA was not supplied; comparison is pending.\nSee BUILD-NOTES.md and CHANGELOG.md for the planned changes.\n' >> "$revision_file"
          fi

          printf '\n## Фактическая ревизия Actions-пакета\n\n```text\n' >> BUILD-NOTES.md
          cat "$revision_file" >> BUILD-NOTES.md
          printf '\n```\n' >> BUILD-NOTES.md

      - name: Build Windows program, shaders and cooker
        run: >-
          /ucrt64/bin/python.exe tools/measure_windows_build.py --phase program --
          cmake --build build-windows
          --target openyamm openyamm_launcher openyamm_runtime_shaders openyamm_sprite_atlas_cook
          --parallel "$MINOTAUR_BUILD_JOBS"

      - name: Build and test Minotaur combat and save compatibility
        run: |
          /ucrt64/bin/python.exe tools/measure_windows_build.py --phase unit-build -- cmake --build build-windows --target openyamm_unit_tests openyamm_runtime_tests --parallel "$MINOTAUR_BUILD_JOBS"
          # MM9 is not shipped by this MM6/MM7/MM8 package; Bloodaxe is not an Axe mechanic test.
          /ucrt64/bin/python.exe tools/measure_windows_build.py --phase gameplay-tests -- build-windows/tests/openyamm_unit_tests.exe --test-case='*alchemy*,*resistance*,*lethal*,*minotaur*,*axe*,*levitate*,*lava*,Reagent stacks*,Inventory hotfix*,Bottle stacks*,Inspect *,*potion*,*bag*,technology skills are appended*,*summary*,*summaries*,*history*,item search*,*steal*,*creation*,*quick item*,*party item*,*teacher*,*trainer*,*completion*,*basebar*,*carried*,*world completion*,resistance and monster effect*,*lich immunit*,*Lich*immun*,*condition immun*,undead and vampires*' --test-case-exclude='MM9*,*MM9 RUDE*,*Bloodaxe*,MM8 lava terrain is drawn by the liquid shader'
          /ucrt64/bin/python.exe tools/measure_windows_build.py --phase world-tests -- build-windows/tests/openyamm_runtime_tests.exe --test-case='Lethal Strike*,Inventory hotfix*,*steal*'

      - name: Test Medusa and the portrait and doll importer
        run: |
          /ucrt64/bin/python.exe tools/measure_windows_build.py --phase medusa-importer-tests -- build-windows/tests/openyamm_unit_tests.exe --source-file='*ProjectMedusaTests.cpp,*CustomPortraitTests.cpp,*AssetFileSystemTests.cpp'

      - name: Test official updater and upstream world regressions
        run: |
          /ucrt64/bin/python.exe tools/measure_windows_build.py --phase updater-engine-tests -- build-windows/tests/openyamm_unit_tests.exe --source-file='*UpdaterTests.cpp'
          /ucrt64/bin/python.exe tools/measure_windows_build.py --phase upstream-ai-tests -- build-windows/tests/openyamm_unit_tests.exe --source-file='*GameplayActorAiSystemTests.cpp,*ActorPathRuntimeTests.cpp,*GameplayBolsterRuntimeTests.cpp,*CharacterSheetRegressionTests.cpp' --test-case-exclude='*MM9*'
          /ucrt64/bin/python.exe tools/measure_windows_build.py --phase upstream-indoor-tests -- build-windows/tests/openyamm_runtime_tests.exe --source-file='*IndoorActorFlyingRuntimeTests.cpp,*IndoorActorDetectionRuntimeTests.cpp,*IndoorActorFactionRuntimeTests.cpp'

      - name: Prepare indexed content (not included in unchanged update payloads)
        run: >-
          /ucrt64/bin/python.exe tools/measure_windows_build.py --phase content --
          /ucrt64/bin/python.exe tools/package_runtime_assets.py
          --assets-root assets_dev --output build-windows/minotaur-content
          --profile desktop --cooker build-windows/game/openyamm_sprite_atlas_cook.exe
          --release "${MINOTAUR_RELEASE_VERSION}" --build "${GITHUB_SHA}"

      - name: Package and verify the small program archive
        run: |
          /ucrt64/bin/python.exe tools/measure_windows_build.py --phase package -- cmake --build build-windows --target openyamm_release_package --parallel "$MINOTAUR_BUILD_JOBS"
          /ucrt64/bin/python.exe tools/verify_minotaur_windows_package.py \
            build-windows/release/OpenYAMM-windows-x64-Release.zip \
            --stage build-windows/release/Release/OpenYAMM \
            --thin --content-dir build-windows/minotaur-content

      - name: Create incremental ZIP and next baseline
        run: >-
          /ucrt64/bin/python.exe tools/measure_windows_build.py --phase update-zip --
          /ucrt64/bin/python.exe tools/minotaur_updates.py build
          --stage build-windows/release/Release/OpenYAMM
          --content build-windows/minotaur-content
          --base "${MINOTAUR_BASE_PATH}" --source-sha "${GITHUB_SHA}"
          --output "build-windows/minotaur-update/Minotaur-Update-${MINOTAUR_RELEASE_VERSION}.zip"
          --baseline-output build-windows/minotaur-update/minotaur-baseline.json

      - name: Upload incremental ZIP
        if: env.MINOTAUR_PACKAGE_MODE != 'full'
        uses: actions/upload-artifact@v7
        with:
          name: minotaur-update-${{ github.sha }}-windows-x64
          path: build-windows/minotaur-update/*.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload baseline and size/checksum report
        uses: actions/upload-artifact@v7
        with:
          name: minotaur-update-metadata-${{ github.sha }}
          path: build-windows/minotaur-update/*.json
          if-no-files-found: error
          retention-days: 90

      - name: Create optional full installation
        if: env.MINOTAUR_PACKAGE_MODE != 'update'
        run: |
          cmake -S . -B build-windows -DOPENYAMM_RELEASE_THIN=OFF
          /ucrt64/bin/python.exe tools/measure_windows_build.py --phase full-package -- cmake --build build-windows --target openyamm_release_package --parallel "$MINOTAUR_BUILD_JOBS"
          /ucrt64/bin/python.exe tools/verify_minotaur_windows_package.py \
            build-windows/release/OpenYAMM-windows-x64-Release.zip \
            --stage build-windows/release/Release/OpenYAMM

      - name: Upload optional full installation
        if: env.MINOTAUR_PACKAGE_MODE != 'update'
        uses: actions/upload-artifact@v7
        with:
          name: openyamm-minotaur-${{ github.sha }}-windows-x64
          path: build-windows/release/OpenYAMM-windows-x64-Release.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload runner resource measurements even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: minotaur-build-resources-${{ github.sha }}
          path: build-resources/
          if-no-files-found: warn
          retention-days: 90
