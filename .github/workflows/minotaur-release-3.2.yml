name: Publish verified Minotaur 2.7 and 3.2

# Keeps the two Windows updates the user installed (#53 over #51, #54 over #53) after their Actions artifacts
# expire. The ZIPs are published unchanged; one over the 2 GiB release asset limit is cut into parts that join
# back into the CI ZIP (SHA-256 checked here and by Join-MinotaurUpdate.cmd).

on:
  push:
    branches: [integration/minotaur-v3.2-20261124]
    paths: [.github/workflows/minotaur-release-3.2.yml]

permissions:
  contents: read

concurrency:
  group: publish-minotaur-3.2
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Plane-PPP/openyamm'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify the CI builds and publish their unchanged ZIPs
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import math
          import pathlib
          import shutil
          import subprocess
          import time
          import zipfile

          repo = 'Plane-PPP/openyamm'
          part_limit = 1_900_000_000  # release assets must be under 2 GiB
          docs = 'https://github.com/Plane-PPP/openyamm/blob/9e3596663bd6c03a7990c028c1c12ca1eed554ff/'

          releases = [
              dict(number=53, run_id=44256532900, branch='integration/minotaur-v2.7-20261117',
                   source='f4dd6d0f33b506f6d757f866aab90bd7d7c76317',
                   tag='minotaur-2.7-f4dd6d0f33b5-53-1', base='minotaur-2.4-51ec30f41533-51-1',
                   base_label='сборка #51, OpenYAMM 2.4',
                   package_id=14409626776, metadata_id=14408369841, size=444754939,
                   sha='2caa93fd6819aea52f4604c417d428ec4d45a018cb986710b11e9d9940d1f089',
                   title='Minotaur Rebalance 2.7 — Windows update', latest=False,
                   upstream='[v2.7](https://github.com/pjasicek/openyamm/releases/tag/v2.7)',
                   about='Сохранён как релиз: на нём основан патч 3.2 (#54).',
                   checked='Windows CI (программа и тесты, сценарии пакетов, офлайн-установщик); '
                           'поверх этой версии установлен и проверен патч 3.2 (#54).',
                   doc=('Отчёт об интеграции 2.7', 'docs/research/openyamm-2.7-integration.md')),
              dict(number=54, run_id=45329059011, branch='integration/minotaur-v3.2-20261124',
                   source='9e3596663bd6c03a7990c028c1c12ca1eed554ff',
                   tag='minotaur-3.2-9e3596663bd6-54-1', base='minotaur-2.7-f4dd6d0f33b5-53-1',
                   base_label='сборка #53, OpenYAMM 2.7, отдельный релиз',
                   package_id=14894344118, metadata_id=14894920829, size=2322561079,
                   sha='f7f5956112c00730fdc833324fa6d08c7f4f651f90f8745b2edf354248083d28',
                   title='Minotaur Rebalance 3.2 — Windows update', latest=True,
                   upstream='[v3.2](https://github.com/pjasicek/openyamm/releases/tag/v3.2) '
                            '(`2539b76596c815be1edd86c703e2a6c98cd6d918`)',
                   about='Изменения Minotaur из 2.7 (баланс, roguelike-режим, Medusa) перенесены на OpenYAMM 3.2.',
                   checked='Windows CI (программа и тесты, сценарии пакетов, офлайн-установщик под PowerShell 5.1), '
                           '13 групп Linux-тестов порта; патч установлен поверх #53 и проверен вручную 2026-11-24.',
                   doc=('Отчёт об интеграции 3.2', 'docs/research/openyamm-3.2-integration.md')),
          ]

          def gh(*args):
              subprocess.run(['gh', *args], check=True)

          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/{path}']))

          def download(artifact_id, path):
              with path.open('wb') as stream:
                  subprocess.run(['gh', 'api', f'repos/{repo}/actions/artifacts/{artifact_id}/zip'],
                                 stdout=stream, check=True)

          def sha256(path):
              with path.open('rb') as stream:
                  return hashlib.file_digest(stream, 'sha256').hexdigest()

          def gib(n):
              return f'{n / 2**30:.2f}'.replace('.', ',') + ' ГиБ'

          def find_release(tag):
              return next((x for x in api('releases?per_page=100') if x['tag_name'] == tag), None)

          def join_script(filename, names, sha):
              lines = ['@echo off', 'setlocal', 'cd /d "%~dp0"']
              lines += [f'if not exist "{n}" (echo Missing {n} & pause & exit /b 1)' for n in names]
              lines += [f'echo Joining {filename} ...',
                        'copy /b ' + '+'.join(f'"{n}"' for n in names) + f' "{filename}" >nul',
                        'if errorlevel 1 (echo Join failed & pause & exit /b 1)',
                        'echo Checking SHA-256 ...',
                        'powershell -NoProfile -ExecutionPolicy Bypass -Command "if ((Get-FileHash -Algorithm '
                        f"SHA256 -LiteralPath '{filename}').Hash -ieq '{sha}') {{ exit 0 }} else {{ exit 1 }}\"",
                        'if errorlevel 1 (echo SHA-256 mismatch: download the parts again & pause & exit /b 1)',
                        f'echo OK: {filename}',
                        'pause']
              return '\r\n'.join(lines) + '\r\n'

          def notes_text(r, report, names, filename):
              n = r['number']
              lines = [
                  f'## Minotaur Rebalance на OpenYAMM {r["tag"].split("-")[1]}',
                  '',
                  f'Готовый Windows ZIP-патч из CI-сборки #{n}, без срока хранения Actions-артефакта. '
                  'Это обновление установленного мода, а не полная установка игры. ' + r['about'],
                  '',
                  f'**Ставится поверх:** `{r["base"]}` ({r["base_label"]}).',
                  f'**Новая версия:** `{r["tag"]}`.',
                  f'**Код сборки:** `{r["source"]}`.',
                  f'**Официальная база:** OpenYAMM {r["upstream"]}.',
                  '',
                  f'Изменённых пакетов в ZIP: {report["changed_packs"]} ({gib(report["changed_pack_bytes"])}), '
                  f'повторно используется: {report["reused_packs"]} ({gib(report["reused_pack_bytes"])}). '
                  f'Размер ZIP: {format(r["size"], ",").replace(",", " ")} байт ({gib(r["size"])}).',
                  '',
              ]
              if len(names) > 1:
                  lines += [
                      '### Скачивание',
                      '',
                      f'GitHub принимает файлы меньше 2 ГиБ, поэтому ZIP из CI разрезан на {len(names)} части без изменений.',
                      '',
                      '1. Скачайте ' + ', '.join(f'`{x}`' for x in names) + ' и `Join-MinotaurUpdate.cmd` в одну папку.',
                      f'2. Запустите `Join-MinotaurUpdate.cmd`: он склеит `{filename}` и проверит его SHA-256.',
                      '   Вручную: `copy /b ' + '+'.join(f'"{x}"' for x in names) + f' "{filename}"` в cmd '
                      'или откройте `.001` в 7-Zip.',
                      '',
                  ]
              lines += [
                  '### Установка',
                  '',
                  '1. Закройте игру, отдельно скопируйте `saves` и `settings.ini`.',
                  '2. Распакуйте ZIP в папку игры и запустите `Apply-MinotaurUpdate.cmd` из папки обновления.',
                  '3. Запустите обычный `OpenYAMM.exe`. Проверьте старое сохранение, запишите новый слот и загрузите его повторно.',
                  '',
                  'Установщик создаёт копию сейвов/настроек в `backups/minotaur/` и сохраняет предыдущую программу и ресурсы '
                  'для отката. Новые сейвы нельзя открыть в старой версии мода.',
                  '',
                  f'Проверено: {r["checked"]}',
                  '',
                  f'[Успешный CI](https://github.com/{repo}/actions/runs/{r["run_id"]}) · '
                  f'[{r["doc"][0]}]({docs}{r["doc"][1]})',
                  '',
                  f'SHA-256 ZIP: `{r["sha"]}`.',
              ]
              return '\n'.join(lines) + '\n'

          def publish(r):
              tag, source = r['tag'], r['source']
              filename = f'Minotaur-Update-{tag}.zip'
              existing = find_release(tag)
              if existing is not None and not existing['draft']:
                  assert existing['target_commitish'] == source, f'{tag}: published from another source'
                  print(f'{tag}: already published, left as it is: {existing["html_url"]}', flush=True)
                  return

              run = api(f'actions/runs/{r["run_id"]}')
              assert run['status'] == 'completed' and run['conclusion'] == 'success', 'Build did not succeed'
              assert run['head_sha'] == source and run['head_branch'] == r['branch']
              assert run['path'] == '.github/workflows/minotaur-windows.yml'
              artifacts = {a['id']: a for a in api(f'actions/runs/{r["run_id"]}/artifacts?per_page=100')['artifacts']}
              package, metadata = artifacts[r['package_id']], artifacts[r['metadata_id']]
              assert not package['expired'] and not metadata['expired']
              assert package['name'] == filename and package['size_in_bytes'] == r['size']
              assert package['digest'] == 'sha256:' + r['sha']

              work = pathlib.Path(f'work-{r["number"]}')
              out = pathlib.Path(f'release-assets-{r["number"]}')
              work.mkdir()
              out.mkdir()
              download(metadata['id'], work / 'metadata.zip')
              with zipfile.ZipFile(work / 'metadata.zip') as archive:
                  records = [json.loads(archive.read(n)) for n in archive.namelist() if n.endswith('.json')]
              report = next(d for d in records if 'archive_sha256' in d)
              baseline = next(d for d in records if 'index' in d)
              assert report['source_sha'] == source and report['base'] == r['base'] and report['target'] == tag
              assert report['archive_sha256'] == r['sha'] and report['archive_bytes'] == r['size']
              assert baseline['source_sha'] == source and baseline['version'] == tag

              package_path = work / filename
              download(package['id'], package_path)
              assert package_path.stat().st_size == r['size']
              assert sha256(package_path) == r['sha'], 'ZIP checksum mismatch'
              print(f'{tag}: verified unchanged ZIP, {r["size"]} bytes', flush=True)

              parts = math.ceil(r['size'] / part_limit)
              if parts == 1:
                  names = [filename]
                  package_path.rename(out / filename)
              else:
                  chunk = math.ceil(r['size'] / parts)
                  names = [f'{filename}.{i:03d}' for i in range(1, parts + 1)]
                  with package_path.open('rb') as stream:
                      for name in names:
                          remaining = chunk
                          with (out / name).open('wb') as part:
                              while remaining:
                                  block = stream.read(min(remaining, 64 << 20))
                                  if not block:
                                      break
                                  part.write(block)
                                  remaining -= len(block)
                  package_path.unlink()
                  joined = hashlib.sha256()
                  for name in names:
                      assert (out / name).stat().st_size < 2**31
                      with (out / name).open('rb') as part:
                          for block in iter(lambda: part.read(64 << 20), b''):
                              joined.update(block)
                  assert joined.hexdigest() == r['sha'], 'The parts do not join into the CI ZIP'
                  (out / 'Join-MinotaurUpdate.cmd').write_bytes(join_script(filename, names, r['sha']).encode('ascii'))
                  print(f'{tag}: cut into {parts} parts that join into the CI ZIP', flush=True)

              sums = ''.join(f'{sha256(out / n)}  {n}\n' for n in names)
              if parts > 1:
                  sums += f'{r["sha"]}  {filename}\n'
              (out / 'SHA256SUMS.txt').write_text(sums, encoding='utf-8')
              (out / 'update-report.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
              (out / 'minotaur-baseline.json').write_text(json.dumps(baseline, indent=2) + '\n', encoding='utf-8')
              notes = work / 'release-notes.md'
              notes.write_text(notes_text(r, report, names, filename), encoding='utf-8')

              if existing is not None:
                  assert existing['target_commitish'] == source, 'Existing draft points to another source'
              else:
                  gh('release', 'create', tag, '--repo', repo, '--target', source, '--title', r['title'],
                     '--notes-file', str(notes), '--draft', '--latest=false')
              for attempt in range(30):  # a new draft takes a moment to show up in the list
                  release = find_release(tag)
                  if release is not None:
                      break
                  time.sleep(2)
              assert release is not None, f'{tag}: the draft is not listed'
              release_id = release['id']
              gh('release', 'upload', tag, '--repo', repo, '--clobber', *[str(p) for p in sorted(out.iterdir())])
              release = api(f'releases/{release_id}')
              assets = {a['name']: a for a in release['assets']}
              assert set(assets) == {p.name for p in out.iterdir()}, 'Incomplete release assets'
              for path in out.iterdir():
                  asset = assets[path.name]
                  assert asset['state'] == 'uploaded' and asset['size'] == path.stat().st_size
                  assert asset['digest'] == 'sha256:' + sha256(path), f'Release asset digest mismatch: {path.name}'
              gh('release', 'edit', tag, '--repo', repo, '--notes-file', str(notes), '--draft=false',
                 '--latest=' + ('true' if r['latest'] else 'false'))
              release = api(f'releases/{release_id}')
              assert not release['draft'] and not release['prerelease']
              assert api(f'git/ref/tags/{tag}')['object']['sha'] == source
              print('Published:', release['html_url'], flush=True)
              for a in release['assets']:
                  print('  ', a['name'], a['size'], a['browser_download_url'], flush=True)
              shutil.rmtree(work)
              shutil.rmtree(out)

          for r in releases:  # 3.2 last: it becomes the latest release
              publish(r)
          PY
