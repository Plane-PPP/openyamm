# Supreme Temple of Baa: the lava pool floors (lavatyl) dealt 1000 magic damage on each step (event 34).
# They are now native lava, as in MM8: the overrides below add the Lava flag (0x40000000) and drop the step
# trigger (0x04000000), so the floors burn every second like any lava and Levitate protects. The event stays
# bound; a save that already holds this map keeps its saved face flags, and so the scripted lava, until the map
# resets.
format_version: 1
kind: "indoor_scene_overlay"
source:
  geometry_file: "6t6.blv"
initial_state:
  face_attribute_overrides:
    - face_index: 1708
      legacy_attributes: 0xc0000110
    - face_index: 2060
      legacy_attributes: 0xc0000110
    - face_index: 2061
      legacy_attributes: 0xc0000110
    - face_index: 2062
      legacy_attributes: 0xc0000110
    - face_index: 2063
      legacy_attributes: 0xc0000110
    - face_index: 2064
      legacy_attributes: 0xc0000110
    - face_index: 2065
      legacy_attributes: 0xc0000110
    - face_index: 2066
      legacy_attributes: 0xc0000110
